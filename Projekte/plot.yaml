# Versionsstand dieser Konfigurationsdatei.
# Dieser Block wird von den Editoren beim Laden geprüft und bei Bedarf aktualisiert.
versioning:
  package_version: '7.1.99'
  config_schema_version: 5
  loaded_config_schema_version: 0
  migration_applied: true

name: Standard Thermo0D Plotpaket
figures:
- title: Standard Thermo0D Plotpaket
  rows: 5
  cols: 2
  subplots:
  - title: Massenströme / Hubvolumen
    plot_type: line
    x_signal: cylinder_theta_deg
    x_title: Kurbelwinkel [deg]
    x_unit_preset: raw
    events: &id001
    - x: 0.0
      label: OT
      color: '#667085'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 160.0
      label: EVO
      color: '#b42318'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 180.0
      label: UT
      color: '#667085'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 300.0
      label: EVC
      color: '#b42318'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 350.0
      label: SOC
      color: '#f79009'
      line_style: --
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 360.0
      label: OT
      color: '#98a2b3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 370.0
      label: IVO
      color: '#175cd3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 405.0
      label: EOC
      color: '#f79009'
      line_style: --
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 510.0
      label: IVC
      color: '#175cd3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 540.0
      label: UT
      color: '#98a2b3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    y_axes:
    - id: ax_mdot
      title: Massenstrom [kg/s]
      side: left
      color: '#111111'
    - id: ax_vol
      title: Hubvolumen [cm³]
      side: right
      color: '#666666'
    series:
    - signal_key: cylinder_mdot_in_kg_per_s
      label: Einströmender Massenstrom
      axis_id: ax_mdot
      color: '#87cefa'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_mdot_out_kg_per_s
      label: Ausströmender Massenstrom
      axis_id: ax_mdot
      color: '#8b0000'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_V_m3
      label: Hubvolumen
      axis_id: ax_vol
      color: '#808080'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
    x_limit_mode: manual
    x_min: 0.0
    x_max: 720.0
  - title: Temperatur / Ventilhub
    plot_type: line
    x_signal: cylinder_theta_deg
    x_title: Kurbelwinkel [deg]
    x_unit_preset: raw
    events: *id001
    y_axes:
    - id: ax_main
      title: Temperatur [K]
      side: left
      color: '#111111'
    - id: ax_lift
      title: Ventilhub [mm]
      side: right
      color: '#1f77b4'
    series:
    - signal_key: cylinder_T_K
      label: Temperatur
      axis_id: ax_main
      color: '#111111'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: intake_valve_valve_lift_m
      label: Einlasshub
      axis_id: ax_lift
      color: '#0000ff'
      line_style: --
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: exhaust_valve_valve_lift_m
      label: Auslasshub
      axis_id: ax_lift
      color: '#ff0000'
      line_style: --
      scale_factor: 1000.0
      unit_preset: raw
    x_limit_mode: manual
    x_min: 0.0
    x_max: 720.0
