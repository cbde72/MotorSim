versioning:
  package_version: preview-v1
  config_schema_version: 5
  loaded_config_schema_version: 5
  migration_applied: false
test_description: Free-piston live editor preview
modeling:
  architecture: free_piston
free_piston:
  initial_conditions:
    x0_m: 0.0
    v0_m_per_s: 12.79
    cylinder:
      pressure_Pa: 140000.0
      temperature_K: 309.9
    combustion_state:
      burned_fraction_0to1: 0.0
      released_energy_J: 0.0
      ignition_armed: false
      injection_armed: false
  mechanics:
    moving_mass_kg: 0.7
    piston_diameter_m: 0.07450721049029624
    compression_ratio: 4.17090909090909
    x_min_m: 0.0
    x_max_m: 0.08
  friction:
    model: coulomb_viscous
    fc_N: 20.0
    cv_Ns_per_m: 0.0
  load:
    model: viscous
    damping_Ns_per_m: 0.0
preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0
  features:
    mass_flow: true
    wall_heat: false
    combustion: false
    evaporation: false
    pv_work: true
  engine:
    cycle_type: 2t
    speed_rpm: 25.0
  volumes:
  - name: cylinder
    type: cylinder
    initial_pressure_Pa: 120000.0
    initial_temperature_K: 320.0
    kinematics:
      type: crank_slider
      bore_m: 0.0745
      stroke_m: 0.0745
      conrod_m: 0.12
      compression_ratio: 10.0
      phase_deg: 0.0
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  - name: bounce
    type: bounce_chamber
    model: gas_spring
    initial_pressure_Pa: 180000.0
    initial_temperature_K: 300.0
    chamber_diameter_m: 0.07450721049029624
    chamber_length_m: 0.08
    compression_ratio: 2.394084732214229
    p0_Pa: 100000.0
    polytropic_exponent: 1.3
  - name: scavenge_plenum
    type: plenum
    initial_pressure_Pa: 160000.0
    initial_temperature_K: 300.0
    fixed_volume_m3: 0.002
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  - name: exhaust_plenum
    type: plenum
    initial_pressure_Pa: 110000.0
    initial_temperature_K: 300.0
    fixed_volume_m3: 0.0025
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  - name: ambient_in
    type: environment
    pressure_Pa: 101325.0
    temperature_K: 300.0
  - name: ambient_out
    type: environment
    pressure_Pa: 101325.0
    temperature_K: 300.0
  connections:
  - name: transfer_slot
    type: slot
    from_volume: scavenge_plenum
    to_volume: cylinder
    source_of_data: rectangle
    opening_mode: by_distance
    distance_from_tdc_m: 0.066
    opening_angle_deg: null
    piston_height_if_crankcase_m: 0.0
    entrance_angle_deg: 0.0
    width_m: 0.02
    height_m: 0.014
    open_fillet_radius_m: 0.0
    full_fillet_radius_m: 0.0
    number_of_identical_holes: 5
    discharge_coefficients:
      mode: constant
      forward_cd: 0.82
      reverse_cd: 0.68
  - name: exhaust_slot
    type: slot
    from_volume: cylinder
    to_volume: exhaust_plenum
    source_of_data: rectangle
    opening_mode: by_distance
    distance_from_tdc_m: 0.0621
    opening_angle_deg: null
    piston_height_if_crankcase_m: 0.0
    entrance_angle_deg: 0.0
    width_m: 0.024
    height_m: 0.014
    open_fillet_radius_m: 0.0
    full_fillet_radius_m: 0.0
    number_of_identical_holes: 4
    discharge_coefficients:
      mode: constant
      forward_cd: 0.78
      reverse_cd: 0.7
simulation:
  dt_s: 1.0e-05
  total_cycles: 1
  save_last_cycles: 1
  simulationtime: 0.25
  solver:
    kind: rk4
    rtol: 1.0e-06
    atol: 1.0e-09
postprocessing:
  csv_enabled: true
  csv_path: results/free_piston_coldflow.csv
  csv_separator: ;
  excel_enabled: false
  excel_path: results/free_piston_coldflow.xlsx
  sampling:
    mode: time
    step_s: 0.0005
  plots:
    enabled: true
  console:
    run_summary:
      enabled: true
