project_root: ../..
base_config: Projekte/variants/free_piston_GenSet_V15.yaml
sweep_name: lambda_v15_1_5
output_dir: Projekte/results/sweeps/lambda_v15_1_5
excel: false
keep_temp_configs: false

description_template: "Free-piston V15 sweep | {parameter_name}={value}"
outdir_template: '{sweep_name}_{run_tag}'
csv_name_template: '{run_tag}.csv'
excel_name_template: '{run_tag}.xlsx'

parameter:
  path: preprocessing.submodels.combustion.hcci_diesel_default.lambda_target
  label: lambda
  round_digits: 2
  range:
    start: 1.0
    step: 0.25
    end: 5.0

collect:
  copy_configs: true
  copy_csv: true
  copy_plots: true
  copy_excel: false
  plots_dir_name: plots
  delete_source_plots_after_collect: false
