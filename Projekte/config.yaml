# Versionsstand dieser Konfigurationsdatei.
# Dieser Block wird von den Editoren beim Laden geprüft und bei Bedarf aktualisiert.
versioning:
  package_version: '7.1.82'
  config_schema_version: 5
  loaded_config_schema_version: 4
  migration_applied: true

preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0
  features:
    mass_flow: true
    wall_heat: true
    combustion: true
    evaporation: true
    pv_work: true
  engine:
    cycle_type: 4t
    speed_rpm: 2500.0
  volumes:
  - name: cylinder
    type: cylinder
    initial_pressure_Pa: 1080650.993791
    initial_temperature_K: 360.0
    kinematics:
      type: crank_slider
      bore_m: 0.086
      stroke_m: 0.086
      conrod_m: 0.143
      compression_ratio: 10.5
      phase_deg: 0.0
    wall_heat:
      model: woschni
      c1: 3.26
      c2: 0.8
      c3: -0.55
      wall_temperature_K: 430.0
      wall_area_m2: 0.032
    combustion:
      model: vibe
      start_deg: 350.0
      duration_deg: 55.0
      a: 6.908
      m: 2.0
      fuel_mass_per_cycle_kg: 2.0e-05
      lhv_J_per_kg: 43000000.0
      angle_reference: compression_tdc
    evaporation:
      model: simple
      start_deg: 330.0
      duration_deg: 30.0
      evaporated_mass_per_cycle_kg: 2.0e-05
      latent_heat_J_per_kg: 350000.0
      angle_reference: compression_tdc
  - name: intake_plenum
    type: plenum
    initial_pressure_Pa: 105042.0
    initial_temperature_K: 305.0
    fixed_volume_m3: 0.0025
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  - name: exhaust_plenum
    type: plenum
    initial_pressure_Pa: 149240.0
    initial_temperature_K: 650.0
    fixed_volume_m3: 0.003
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  connections:
  - name: intake_valve
    type: valve
    from_volume: intake_plenum
    to_volume: cylinder
    opening_angle_deg: 330.0
    opening_reference: absolute
    profile_angle_domain: crank
    lift_scale: 1.0
    lash_m: 0.0001
    lift_file: data/intake_valve_lift.csv
    alpha_k_file: data/intake_alpha_k.csv
  - name: exhaust_valve
    type: valve
    from_volume: cylinder
    to_volume: exhaust_plenum
    opening_angle_deg: 120.0
    opening_reference: absolute
    profile_angle_domain: crank
    lift_scale: 1.0
    lash_m: 0.0001
    lift_file: data/exhaust_valve_lift.csv
    alpha_k_file: data/exhaust_alpha_k.csv
simulation:
  dt_s: 2.0e-05
  total_cycles: 3
  save_last_cycles: 2
  solver:
    kind: rk4
    rtol: 1.0e-06
    atol: 1.0e-09
postprocessing:
  csv_path: results/one_cyl_4t.csv
  csv_separator: ;
  sampling:
    mode: crank_angle
    step_deg: 1.0
  final_cycle_uniform_angle_export:
    enabled: false
    step_deg: 1.0
  check_report:
    enabled: true
    html_enabled: false
  plots:
    enabled: true
    source: last_cycle_uniform
    output_dir: results/plots
    layouts:
      auto_create_defaults: true
      entries: []
  console:
    run_summary:
      enabled: true
    cycle_summary:
      enabled: true
    check_report:
      enabled: true
    geometry:
      enabled: true
