simulation:
  dt_s: 1.0e-05
  total_cycles: 3
  save_last_cycles: 2
  simulationtime: 0.2
  solver:
    kind: rk4
    rtol: 1.0e-05
    atol: 1.0e-07
postprocessing:
  auto_update_initial_conditions: false
  csv_enabled: true
  csv_path: results/free_piston_GenSet_V13.csv
  csv_separator: ;
  excel_enabled: false
  excel_path: results/free_piston_GenSet_V13.xlsx
  sampling:
    mode: time
    step_s: 0.0001
  final_cycle_uniform_angle_export:
    enabled: false
    step_deg: 1.0
  free_piston_last_ut_ot_ut_export:
    enabled: true
    step_deg: 0.1
    axis_min_deg: -9.0
    axis_max_deg: 9.0
  check_report:
    enabled: false
    html_enabled: false
  plots:
    enabled: true
    source: export_rows
    layouts:
      auto_create_defaults: true
      entries:
      - enabled: true
        path: plot_CFG/plot-v11_hub.yaml
        prefix: plot_v11_hub
      - enabled: false
        path: plot_CFG/plot-v11_Energy.yaml
        prefix: plot_fp_energy
      - enabled: true
        path: plot_CFG/plot-v11_fp4.yaml
        prefix: plot_fp4
      - enabled: false
        path: plot_CFG/plot-v11-fp_pressure.yaml
        prefix: plot_fp_pressure
      - enabled: true
        path: plot_CFG/plot-v11-fp_mass.yaml
        prefix: plot_fp_mass
      - enabled: false
        path: plot_CFG/plot-v11-fp_flow.yaml
        prefix: plot_fp_mass
      - enabled: false
        path: plot_CFG/plot-v11-fp_scavenging_check.yaml
        prefix: plot_fp_scavenging_check
      - enabled: false
        path: plot_CFG/plot-v11-fp_scavenging_lastcycle_zoom.yaml
        prefix: plot_fp_scavenging_lastcycle
      - enabled: false
        path: plot_CFG/plot-v11-fp_species_tracking_check.yaml
        prefix: plot_fp_species_check
      - enabled: false
        path: plot_CFG/plot-v11-fp_species_transport_detail.yaml
        prefix: plot_fp_species_transport
    output_dir: results/plots
  console:
    run_summary:
      enabled: true
    cycle_summary:
      enabled: false
    check_report:
      enabled: false
    geometry:
      enabled: false
