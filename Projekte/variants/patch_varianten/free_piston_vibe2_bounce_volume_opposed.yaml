versioning:
  package_version: 7.1.89
  config_schema_version: 5
  loaded_config_schema_version: 5
  migration_applied: false
test_description: Free-piston with Vibe heat release on the compression stroke, direct
  added energy in J, hub scaling and controlled generator load near both dead centers
modeling:
  architecture: free_piston
free_piston:
  initial_conditions:
    x0_m: 0.04587156
    v0_m_per_s: -4.2
    cylinder:
      pressure_Pa: 120000.0
      temperature_K: 306.0
    combustion_state:
      burned_fraction_0to1: 0.0
      released_energy_J: 0.0
      ignition_armed: false
      injection_armed: false
  mechanics:
    moving_mass_kg: 0.7
    piston_area_m2: 0.00436
    clearance_volume_m3: 8.16326530612245e-06
    x_min_m: 0.0
    x_max_m: 0.08
  friction:
    model: coulomb_viscous
    fc_N: 50.0
    cv_Ns_per_m: 0
  load:
    model: viscous
    damping_Ns_per_m: 0
preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0
  features:
    mass_flow: false
    wall_heat: false
    combustion: true
    evaporation: false
    pv_work: false
  engine:
    cycle_type: 2t
    speed_rpm: 25.0
  volumes:
  - name: cylinder
    type: cylinder
    initial_pressure_Pa: 120000.0
    initial_temperature_K: 306.0
    kinematics:
      type: crank_slider
      bore_m: 0.0745
      stroke_m: 0.08
      conrod_m: 0.12
      compression_ratio: 50.0
      phase_deg: 0.0
    wall_heat:
      model: none
    combustion:
      model: vibe
      start_mode: compression_hub
      start_hub_m: 0.042
      duration_hub_m: 0.0055
      a: 6.9
      m: 2.0
      added_energy_per_cycle_J: 500.0
      energy_coupling: none
      stroke_reference_m: 0.08
      stroke_exponent: 0.01
    evaporation:
      model: none
  - name: bounce
    type: bounce_chamber
    model: gas_spring
    initial_pressure_Pa: 178629.0
    initial_temperature_K: 295.2
    chamber_diameter_m: 0.07450721049029624
    chamber_length_m: 0.08
    compression_ratio: 2.744
    p0_Pa: 364025.0
    polytropic_exponent: 1.28
  - name: scavenge_plenum
    type: plenum
    initial_pressure_Pa: 160000.0
    initial_temperature_K: 300.0
    fixed_volume_m3: 0.002
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  - name: exhaust_plenum
    type: plenum
    initial_pressure_Pa: 110000.0
    initial_temperature_K: 300.0
    fixed_volume_m3: 0.0025
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  - name: ambient_in
    type: environment
    pressure_Pa: 161325.0
    temperature_K: 300.0
  - name: ambient_out
    type: environment
    pressure_Pa: 101325.0
    temperature_K: 300.0
  connections:
  - name: scavenge_feed
    type: orifice
    from_volume: ambient_in
    to_volume: scavenge_plenum
    area_m2: 8.0e-05
    forward_cd: 1.0
    reverse_cd: 1.0
  - name: transfer_slot
    type: slot
    from_volume: scavenge_plenum
    to_volume: cylinder
    source_of_data: rectangle
    opening_mode: by_distance
    distance_from_tdc_m: 0.066
    opening_angle_deg: null
    piston_height_if_crankcase_m: 0.0
    entrance_angle_deg: 0.0
    width_m: 0.02
    height_m: 0.014
    open_fillet_radius_m: 0.0
    full_fillet_radius_m: 0.0
    number_of_identical_holes: 4
    discharge_coefficients:
      mode: constant
      forward_cd: 1.0
      reverse_cd: 1.0
  - name: exhaust_slot
    type: slot
    from_volume: cylinder
    to_volume: exhaust_plenum
    source_of_data: rectangle
    opening_mode: by_distance
    distance_from_tdc_m: 0.062
    opening_angle_deg: null
    piston_height_if_crankcase_m: 0.0
    entrance_angle_deg: 0.0
    width_m: 0.0238
    height_m: 0.018
    open_fillet_radius_m: 0.0
    full_fillet_radius_m: 0.0
    number_of_identical_holes: 4
    discharge_coefficients:
      mode: constant
      forward_cd: 1.0
      reverse_cd: 1.0
  - name: exhaust_bleed
    type: orifice
    from_volume: exhaust_plenum
    to_volume: ambient_out
    area_m2: 0.00012
    forward_cd: 0.72
    reverse_cd: 0.55
simulation:
  dt_s: 1.0e-05
  total_cycles: 1
  save_last_cycles: 1
  simulationtime: 0.2
  solver:
    kind: rk4
    rtol: 1.0e-06
    atol: 1.0e-09
postprocessing:
  csv_enabled: true
  csv_path: results/free_piston_vibe_generator.csv
  csv_separator: ;
  excel_enabled: false
  excel_path: results/free_piston_vibe_generator.xlsx
  sampling:
    mode: time
    step_s: 0.0001
  final_cycle_uniform_angle_export:
    enabled: false
    step_deg: 1.0
  check_report:
    enabled: false
    html_enabled: false
  plots:
    enabled: true
    source: export_rows
    layouts:
      auto_create_defaults: true
      entries:
      - enabled: true
        path: plot_fp.yaml
        prefix: plot_fp
  console:
    run_summary:
      enabled: true
    cycle_summary:
      enabled: false
    check_report:
      enabled: false
    geometry:
      enabled: false
