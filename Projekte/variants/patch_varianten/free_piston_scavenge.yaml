versioning:
  package_version: 7.1.91
  config_schema_version: 5
  loaded_config_schema_version: 5
  migration_applied: false

test_description: 'Free-piston coldflow with gas-exchange bounce pump, inlet/outlet check valves, receiver buffering, cylinder scavenging from receiver, exhaust via slots'

modeling:
  architecture: free_piston

free_piston:
  initial_conditions:
    x0_m: 0.046
    v0_m_per_s: -3.8
    
    cylinder:
      pressure_Pa: 118000.0
      temperature_K: 306.0
    
    combustion_state:
      burned_fraction_0to1: 0.0
      released_energy_J: 0.0
      ignition_armed: false
      injection_armed: false
  
  mechanics:
    moving_mass_kg: 0.85
    piston_area_m2: 0.00436
    clearance_volume_m3: 8.2e-06
    x_min_m: 0.0
    x_max_m: 0.08

  friction:
    model: coulomb_viscous
    fc_N: 35.0
    cv_Ns_per_m: 2.0

  load:
    model: viscous
    damping_Ns_per_m: 10.0

preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0
  features:
    mass_flow: true
    wall_heat: false
    combustion: false
    evaporation: false
    pv_work: true
  engine:
    cycle_type: 2t
    speed_rpm: 25.0
  
  volumes:
    - name: cylinder
      type: cylinder
      initial_pressure_Pa: 118000.0
      initial_temperature_K: 306.0
      kinematics:
        type: crank_slider
        bore_m: 0.0745
        stroke_m: 0.092
        conrod_m: 0.12
        compression_ratio: 50.0
        phase_deg: 0.0
      
      wall_heat: { model: none }
      combustion: { model: none }
      evaporation: { model: none }

 

















    - name: bounce
      type: bounce_chamber
      model: gas_exchange
      initial_pressure_Pa: 100500.0
      initial_temperature_K: 300.0
      chamber_diameter_m: 0.055
      chamber_length_m: 0.08
      compression_ratio: 2.2
      polytropic_exponent: 1.30

    - name: receiver
      type: plenum
      initial_pressure_Pa: 112000.0
      initial_temperature_K: 300.0
      fixed_volume_m3: 0.0018
      wall_heat: { model: none }
      combustion: { model: none }
      evaporation: { model: none }

    - name: exhaust_plenum
      type: plenum
      initial_pressure_Pa: 106000.0
      initial_temperature_K: 300.0
      fixed_volume_m3: 0.0025
      wall_heat: { model: none }
      combustion: { model: none }
      evaporation: { model: none }

    
    
    
    
    
    
    
    
    
    - name: ambient_in
      type: environment
      pressure_Pa: 101325.0
      temperature_K: 300.0

    - name: ambient_out
      type: environment
      pressure_Pa: 101325.0
      temperature_K: 300.0

  connections:
  
    - name: bounce_in_cv
      type: check_valve
      from_volume: ambient_in
      to_volume: bounce
      area_m2: 1.2e-4
      discharge_coefficient: 0.72
      cracking_pressure_Pa: 400.0

    - name: bounce_out_cv
      type: check_valve
      from_volume: bounce
      to_volume: receiver
      area_m2: 1.0e-4
      discharge_coefficient: 0.72
      cracking_pressure_Pa: 1200.0


   - name: transfer_slot
      type: slot
      from_volume: receiver
      to_volume: cylinder
      source_of_data: rectangle
      opening_mode: by_distance
      distance_from_tdc_m: 0.066
      opening_angle_deg: null
      piston_height_if_crankcase_m: 0.0
      entrance_angle_deg: 0.0
      width_m: 0.020
      height_m: 0.014
      open_fillet_radius_m: 0.0
      full_fillet_radius_m: 0.0
      number_of_identical_holes: 4
      discharge_coefficients:
        mode: constant
        forward_cd: 0.82
        reverse_cd: 0.60

    - name: exhaust_slot
      type: slot
      from_volume: cylinder
      to_volume: exhaust_plenum
      source_of_data: rectangle
      opening_mode: by_distance
      distance_from_tdc_m: 0.062
      opening_angle_deg: null
      piston_height_if_crankcase_m: 0.0
      entrance_angle_deg: 0.0
      width_m: 0.0238
      height_m: 0.014
      open_fillet_radius_m: 0.0
      full_fillet_radius_m: 0.0
      number_of_identical_holes: 4
      discharge_coefficients:
        mode: constant
        forward_cd: 0.78
        reverse_cd: 0.68

    - name: exhaust_bleed
      type: orifice
      from_volume: exhaust_plenum
      to_volume: ambient_out
      area_m2: 1.2e-4
      forward_cd: 0.72
      reverse_cd: 0.55

simulation:
  dt_s: 1.0e-5
  total_cycles: 1
  save_last_cycles: 1
  simulationtime: 0.12
  solver:
    kind: rk4
    rtol: 1.0e-6
    atol: 1.0e-9

postprocessing:
  csv_enabled: true
  csv_path: results/free_piston_bounce_receiver_scavenge.csv
  csv_separator: ";"
  excel_enabled: false
  sampling:
    mode: time
    step_s: 2.5e-4
  final_cycle_uniform_angle_export:
    enabled: false
    step_deg: 1.0
  check_report:
    enabled: false
    html_enabled: false
  plots:
    enabled: true
    source: export_rows
    layouts:
      auto_create_defaults: false
      entries:
        - enabled: true
          path: plot_fp_bounce_receiver_scavenge.yaml
          prefix: plot_fp_bounce_receiver_scavenge
  console:
    run_summary: { enabled: true }
    cycle_summary: { enabled: false }
    check_report: { enabled: false }
    geometry: { enabled: false }
