versioning:
  package_version: 7.1.93
  config_schema_version: 5
  loaded_config_schema_version: 5
  migration_applied: false
test_description: Free-piston with Vibe heat release on the compression stroke, direct
  added energy in J, hub scaling and controlled generator load near both dead centers
modeling:
  architecture: free_piston

free_piston:
  initial_conditions:
    x0_m: 0.09
    v0_m_per_s: -3.6
    cylinder:
      pressure_Pa: 120000.0
      temperature_K: 306.0
    combustion_state:
      burned_fraction_0to1: 0.0
      released_energy_J: 0.0
      ignition_armed: false
      injection_armed: false
  mechanics:
    moving_mass_kg: 0.7
    piston_diameter_m: 0.0605
    compression_ratio: 50
    x_min_m: 0.0
    x_max_m: 0.108
  friction:
    model: coulomb_viscous
    fc_N: 0.0
    cv_Ns_per_m: 0
  load:
    model: viscous
    damping_Ns_per_m: 0






preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0
  features:
    mass_flow: true
    wall_heat: false
    combustion: false
    evaporation: false
    pv_work: false
  engine:
    cycle_type: 2t
    speed_rpm: 25.0
  volumes:
  - name: cylinder
    type: cylinder
    initial_pressure_Pa: 120000.0
    initial_temperature_K: 306.0
    kinematics:
      type: crank_slider
      bore_m: 0.0745
      stroke_m: 0.08
      conrod_m: 0.12
      compression_ratio: 50.0
      phase_deg: 0.0
    wall_heat:
      model: none




    combustion:
      model: vibe
      # Free-piston Vibe directly over the compression hub, no angle input needed.
      # start_hub_m is measured on the compression stroke from BDC toward TDC.
      # For the current 80 mm nominal stroke this corresponds to:
      #   start_hub_m = 42.22 mm  -> former SOC at about 275 deg local cylinder angle
      #   duration_hub_m = 3.56 mm -> former burn window of about 8 deg
      start_mode: compression_hub
      start_hub_m: 0.0522
      duration_hub_m: 0.0189
      a: 6.9
      m: 2.0
      added_energy_per_cycle_J: 250.0
      energy_coupling: none #stroke_ratio
      stroke_reference_m: 0.0108
      stroke_exponent: 0.01
    
    evaporation:
      model: none
  - name: bounce
    type: bounce_chamber
    model: gas_exchange
    initial_pressure_Pa: 564025.0
    initial_temperature_K: 300.0
    chamber_diameter_m: 0.070
    chamber_length_m: 0.108
    compression_ratio: 16
    polytropic_exponent: 1.3

  - name: receiver
    type: plenum
    initial_pressure_Pa: 412000.0
    initial_temperature_K: 300.0
    fixed_volume_m3: 4.8e-4
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  - name: exhaust_plenum
    type: plenum
    initial_pressure_Pa: 110000.0
    initial_temperature_K: 300.0
    fixed_volume_m3: 0.00260279
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  - name: ambient_in
    type: environment
    pressure_Pa: 101325.0
    temperature_K: 300.0
  - name: ambient_out
    type: environment
    pressure_Pa: 101325.0
    temperature_K: 300.0
 




 

  connections:

  - name: bounce_in_cv
    type: check_valve
    from_volume: ambient_in
    to_volume: bounce
    area_m2: 0.00012
    discharge_coefficient: 0 # 0.72
    cracking_pressure_Pa: 400.0
    
  - name: bounce_out_cv
    type: check_valve
    from_volume: bounce
    to_volume: receiver
    area_m2: 0.0001
    discharge_coefficient: 0.72
    cracking_pressure_Pa: 1200.0
    
    
  - name: transfer_slot
    type: slot
    from_volume: receiver
    to_volume: cylinder
    source_of_data: rectangle
    opening_mode: by_distance
    distance_from_tdc_m: 0.09207
    opening_angle_deg: null
    piston_height_if_crankcase_m: 0.0
    entrance_angle_deg: 0.0
    width_m: 0.026
    height_m: 0.016
    open_fillet_radius_m: 0.0
    full_fillet_radius_m: 0.0
    number_of_identical_holes: 6
    discharge_coefficients:
      mode: constant
      forward_cd: 0.9
      reverse_cd: 0.9

  - name: exhaust_slot
    type: slot
    from_volume: cylinder
    to_volume: exhaust_plenum
    source_of_data: rectangle
    opening_mode: by_distance
    distance_from_tdc_m: 0.0906
    opening_angle_deg: null
    piston_height_if_crankcase_m: 0.0
    entrance_angle_deg: 0.0
    width_m: 0.024
    height_m: 0.018
    open_fillet_radius_m: 0.0
    full_fillet_radius_m: 0.0
    number_of_identical_holes: 6
    discharge_coefficients:
      mode: constant
      forward_cd: 0.95
      reverse_cd: 0.8
      
  - name: exhaust_bleed
    type: orifice
    from_volume: exhaust_plenum
    to_volume: ambient_out
    area_m2: 0.00012
    forward_cd: 0 #0.72
    reverse_cd: 0.55
    
simulation:
  dt_s: 1.0e-05
  total_cycles: 1
  save_last_cycles: 1
  simulationtime: 0.4
  solver:
    kind: rk4
    rtol: 1.0e-06
    atol: 1.0e-09

postprocessing:
  csv_enabled: true
  csv_path: results/free_piston_scav_V03.csv
  csv_separator: ;
  excel_enabled: false
  excel_path: results/free_piston_scav_V03.xlsx
  sampling:
    mode: time
    step_s: 0.0001

  final_cycle_uniform_angle_export:
    enabled: false
    step_deg: 1.0
  check_report:
    enabled: false
    html_enabled: false
  plots:
    enabled: true
    source: export_rows
    layouts:
      auto_create_defaults: true
      entries:
      - enabled: true
        path: plot_fp.yaml
        prefix: plot_fp

      - enabled: true
        path: plot-fp_pressure.yaml
        prefix: plot_fp_pressure

      - enabled: true
        path: plot-fp_mdot.yaml
        prefix: plot_fp_mdot

      - enabled: true
        path: plot-fp_mass.yaml
        prefix: plot_fp_mass
        
    output_dir: results/plots
  console:
    run_summary:
      enabled: true
    cycle_summary:
      enabled: false
    check_report:
      enabled: false
    geometry:
      enabled: false
