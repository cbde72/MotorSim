test_description: Free-piston Stage A with stateful gas-exchange bounce volume and two orifices

modeling:
  architecture: free_piston

preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0

  features:
    mass_flow: true
    wall_heat: false
    combustion: false
    evaporation: false
    pv_work: true

  engine:
    cycle_type: 2t
    speed_rpm: 25.0

  volumes:
    - name: cylinder
      type: cylinder
      initial_pressure_Pa: 120000.0
      initial_temperature_K: 320.0
      kinematics:
        type: crank_slider
        bore_m: 0.0745
        stroke_m: 0.08
        conrod_m: 0.12
        compression_ratio: 10.0
        phase_deg: 0.0
      wall_heat: { model: none }
      combustion: { model: none }
      evaporation: { model: none }

    - name: bounce
      type: bounce_chamber
      model: gas_exchange
      initial_pressure_Pa: 110000.0
      initial_temperature_K: 300.0
      chamber_diameter_m: 0.055
      chamber_length_m: 0.08
      compression_ratio: 2.5
      polytropic_exponent: 1.30

    - name: ambient_in
      type: environment
      pressure_Pa: 101325.0
      temperature_K: 300.0

    - name: ambient_out
      type: environment
      pressure_Pa: 101325.0
      temperature_K: 300.0

  connections:
    - name: bounce_in
      type: orifice
      from_volume: ambient_in
      to_volume: bounce
      area_m2: 4.0e-5
      forward_cd: 0.72
      reverse_cd: 0.40

    - name: bounce_out
      type: orifice
      from_volume: bounce
      to_volume: ambient_out
      area_m2: 4.0e-5
      forward_cd: 0.72
      reverse_cd: 0.40

simulation:
  dt_s: 1.0e-5
  total_cycles: 1
  save_last_cycles: 1
  simulationtime: 0.001
  solver:
    kind: rk4
    rtol: 1.0e-6
    atol: 1.0e-9

postprocessing:
  csv_enabled: true
  csv_path: results/free_piston_bounce_stage_a.csv
  csv_separator: ";"
  excel_enabled: false
  sampling:
    mode: time
    step_s: 1.0e-4
  final_cycle_uniform_angle_export:
    enabled: false
    step_deg: 1.0
  check_report:
    enabled: false
    html_enabled: false
  plots:
    enabled: false
    source: export_rows
    layouts:
      auto_create_defaults: false
  console:
    run_summary: { enabled: false }
    cycle_summary: { enabled: false }
    check_report: { enabled: false }
    geometry: { enabled: false }

free_piston:
  initial_conditions:
    x0_m: 0.01
    v0_m_per_s: -0.2
    cylinder:
      pressure_Pa: 120000.0
      temperature_K: 320.0

  mechanics:
    moving_mass_kg: 2.0
    piston_area_m2: 0.00436
    clearance_volume_m3: 2.5e-5
    x_min_m: 0.0
    x_max_m: 0.08

  friction:
    model: coulomb_viscous
    fc_N: 20.0
    cv_Ns_per_m: 10.0

  load:
    model: viscous
    damping_Ns_per_m: 120.0
