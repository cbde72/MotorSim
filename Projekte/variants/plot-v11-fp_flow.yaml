name: Free-Piston Combined Slot and Connection Mass Flows
style:
  preset_name: Light Engineering
  font_family: DejaVu Sans
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  subplot_title_visible: true
  figure_title_visible: false
  grid_visible: true
  grid_alpha: 0.3
  legend_visible: true
  legend_position: best
  tight_layout: true
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- title: Exhaust-Slot Massenstrom-Komponenten
  rows: 1
  cols: 1
  subplots:
  - title: Exhaust-Slot über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mdot
      title: Massenstrom [mg/s]
      side: left
      color: '#111111'
      limit_mode: auto
      y_min: -1.0
      y_max: 11.0
    series:
    - signal_key: exhaust_slot_1_mdot_kg_per_s
      label: exhaust_slot total
      axis_id: ax_mdot
      color: '#111111'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
    - signal_key: exhaust_slot_1_mdot_unburned_kg_per_s
      label: exhaust_slot unburned
      axis_id: ax_mdot
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
    - signal_key: exhaust_slot_1_mdot_burned_kg_per_s
      label: exhaust_slot burned
      axis_id: ax_mdot
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
- id: f42ffd1452a2
  title: Free-Piston Massenströme aktiver Connections
  rows: 1
  cols: 1
  subplots:
  - id: 25f109345fb4
    title: Massenströme über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_scale_factor: 1.0
    x_offset: 0.0
    x_limit_mode: auto
    x_min: 0.0
    x_max: 720.0
    y_axes:
    - id: ax_mdot
      title: Massenstrom [g/s]
      side: left
      spine_offset: 0.0
      color: '#111111'
      visible: true
      limit_mode: data
      y_min: 0.0
      y_max: 1.0
      tick_step: 0.0
      minor_tick_step: 0.0
      major_grid: true
      minor_grid: false
    series:
    - id: 2fff71a5c5zz
      signal_key: compressor_1_in_cv_mdot_kg_per_s
      label: compressor_1_in_cv
      axis_id: ax_mdot
      visible: true
      color: '#0ffa4f'
      line_style: '-'
      marker: ''
      line_width: 1.0
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1000.0
      offset: 0.0
      series_type: line
    - id: 616ba3fed924
      signal_key: transfer_slot_1_mdot_kg_per_s
      label: transfer_slot
      axis_id: ax_mdot
      visible: true
      color: '#b42318'
      line_style: '-'
      marker: ''
      line_width: 1.0
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1000.0
      offset: 0.0
      series_type: line
    - id: 296bf6afc3fe
      signal_key: exhaust_slot_1_mdot_kg_per_s
      label: exhaust_slot
      axis_id: ax_mdot
      visible: true
      color: '#7a5af8'
      line_style: '-'
      marker: ''
      line_width: 1.0
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1000.0
      offset: 0.0
      series_type: line
    events: []
    legend_visible: true
    legend_position: best
    show_grid: true
- title: Transfer-Slot Massenstrom-Komponenten
  rows: 1
  cols: 1
  subplots:
  - title: Transfer-Slot über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mdot
      title: Massenstrom [mg/s]
      side: left
      color: '#111111'
      limit_mode: auto
      y_min: -1.0
      y_max: 11.0
    series:
    - signal_key: transfer_slot_1_mdot_kg_per_s
      label: transfer_slot total
      axis_id: ax_mdot
      color: '#111111'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
    - signal_key: transfer_slot_1_mdot_unburned_kg_per_s
      label: transfer_slot unburned
      axis_id: ax_mdot
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
    - signal_key: transfer_slot_1_mdot_burned_kg_per_s
      label: transfer_slot burned
      axis_id: ax_mdot
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw

