versioning:
  package_version: 7.1.82
  config_schema_version: 5
  loaded_config_schema_version: 5
  migration_applied: false
modeling:
  architecture: classic

preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0
  features:
    mass_flow: true
    wall_heat: true
    combustion: true
    evaporation: false
    pv_work: true
  engine:
    cycle_type: 4t
    speed_rpm: 2500.0
  volumes:
  - name: intake_env
    type: environment
    pressure_Pa: 101325.0
    temperature_K: 293.15
  - name: exhaust_env
    type: environment
    pressure_Pa: 101325.0
    temperature_K: 293.15
  - name: cylinder
    type: cylinder
    initial_temperature_K: 360.0
    kinematics:
      type: crank_slider
      bore_m: 0.0745
      stroke_m: 0.0859
      conrod_m: 0.14
      compression_ratio: 14.0
      phase_deg: 0.0
    wall_heat:
      model: woschni
      variant: promo
      wall_temperature_K: 430.0
      wall_area_m2: 0.032
      multiplier: 1.0
      dp_mode: 'off'
      reference_state_mode: none
      phase_mode: promo
      cucm: 0.0
      swirl_number: 0.0
      imep_bar: 0.0
      c1: 2.28
      c2: 0.00324
      c3: 0.0
    combustion:
      model: vibe
      start_deg: -20.0
      duration_deg: 55.0
      a: 6.908
      m: 2.0
      fuel_mass_per_cycle_kg: 2.5e-05
      lhv_J_per_kg: 43000000.0
      angle_reference: compression_tdc
    evaporation:
      model: simple
      start_deg: 330.0
      duration_deg: 30.0
      evaporated_mass_per_cycle_kg: 2.0e-05
      latent_heat_J_per_kg: 350000.0
      angle_reference: compression_tdc
    initial_pressure_Pa: 101325.0
  - name: intake_plenum
    type: plenum
    initial_pressure_Pa: 109240.0
    initial_temperature_K: 298.0
    fixed_volume_m3: 3.0025
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  - name: exhaust_plenum
    type: plenum
    initial_pressure_Pa: 119240.0
    initial_temperature_K: 298.0
    fixed_volume_m3: 3.003
    wall_heat:
      model: none
    combustion:
      model: none
    evaporation:
      model: none
  connections:
  - name: intake_valve
    type: valve
    from_volume: intake_plenum
    to_volume: cylinder
    opening_angle_deg: 337.0
    opening_reference: absolute
    profile_angle_domain: crank
    lift_scale: 1.0
    lash_m: 0.0001
    lift_file: data/intake_valve_lift_A151_2V.csv
    alpha_k_file: data/intake_alpha_k_A151_2V.csv
  - name: exhaust_valve
    type: valve
    from_volume: cylinder
    to_volume: exhaust_plenum
    opening_angle_deg: 140.0
    opening_reference: absolute
    profile_angle_domain: crank
    lift_scale: 1.0
    lash_m: 0.0001
    lift_file: data/exhaust_valve_lift_A151_2V.csv
    alpha_k_file: data/exhaust_alpha_k_A151_2V.csv
  - name: intake_throttle
    type: orifice
    from_volume: intake_env
    to_volume: intake_plenum
    area_m2: 0.001963495
    forward_cd: 0.98
    reverse_cd: 0.98
  - name: exhaust_throttle
    type: orifice
    from_volume: exhaust_env
    to_volume: exhaust_plenum
    area_m2: 0.0013
    forward_cd: 0.98
    reverse_cd: 0.98
simulation:
  dt_s: 1.0e-06
  total_cycles: 30
  save_last_cycles: 1
  solver:
    kind: rk4
    rtol: 1.0e-06
    atol: 1.0e-09
postprocessing:
  csv_enabled: true
  csv_path: results/A156A1_WW02_vibe_cyl_4t.csv
  excel_enabled: false
  excel_path: results/A156A1_WW02_vibe_cyl_4t.xlsx
  csv_separator: ;
  sampling:
    mode: crank_angle
    step_deg: 1.0
  final_cycle_uniform_angle_export:
    enabled: true
    step_deg: 1.0
  check_report:
    enabled: true
    html_enabled: true
  plots:
    enabled: true
    source: last_cycle_uniform
    output_dir: results/plots
    layouts:
      auto_create_defaults: true
      entries:
      - enabled: true
        path: plot.yaml
        prefix: ''
      - enabled: true
        path: plot10.yaml
        prefix: plot10
      - enabled: false
        path: plot11.yaml
        prefix: plot11
  console:
    run_summary:
      enabled: true
    cycle_summary:
      enabled: true
    check_report:
      enabled: true
    geometry:
      enabled: true
test_description: A156A1 4T Wandwärme Test 02 - Woschni Promo (Vibe)
