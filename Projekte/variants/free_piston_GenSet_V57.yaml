    - name: receiver_2
      ref: receiver_plenum
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_pressure_Pa: 163390.95693530387
      initial_pressure_Pa: 162543.69808449852
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_temperature_K: 355.20148468608716
