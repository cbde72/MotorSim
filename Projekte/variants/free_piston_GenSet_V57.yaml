      evaporation:
        model: none
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_burned_mass_percent: 56.01850516435841
      initial_burned_mass_percent: 55.72131373147726
    - name: intake_plenum
      ref: intake_plenum
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_pressure_Pa: 101167.95424354242
      initial_pressure_Pa: 101173.30493231556
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_temperature_K: 300.1313282941559
      initial_temperature_K: 300.1377752759611
      initial_burned_fraction_0to1: 0.0
      type: plenum
      fixed_volume_m3: 0.00158633
      wall_heat:
        model: none
      combustion:
        model: none
      evaporation:
        model: none
      wall_temperature:
        model: none
      initial_burned_mass_percent: 0.0
    - name: compressor_1
      ref: compressor_bounce
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_pressure_Pa: 101011.95782326059
      initial_pressure_Pa: 101022.61959681305
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_temperature_K: 304.0003372929174
      initial_temperature_K: 303.9999144129564
      type: bounce_chamber
      model: gas_exchange
      initial_burned_fraction_0to1: 0.0
      chamber_diameter_m: 0.07
      chamber_length_m: 0.10807
      compression_ratio: 16
      polytropic_exponent: 1.3
      # Feste Wandtemperatur und Woschni-Waermeuebergang aus der Bibliothek.
      wall_heat:
        ref: woschni_promo_compressor_wall
      initial_burned_mass_percent: 0.0
    - name: compressor_2
      ref: compressor_bounce
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_pressure_Pa: 172826.6152689823
      initial_pressure_Pa: 171691.31658892432
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_temperature_K: 353.5322506722045
      initial_temperature_K: 352.953429070025
      type: bounce_chamber
      model: gas_exchange
      initial_burned_fraction_0to1: 0.0
      chamber_diameter_m: 0.07
      chamber_length_m: 0.10807
      compression_ratio: 16
      polytropic_exponent: 1.3
      # Identischer Ansatz fuer eine symmetrische thermische Parametrierung.
      wall_heat:
        ref: woschni_promo_compressor_wall
      initial_burned_mass_percent: 0.0
    - name: receiver_1
      ref: receiver_plenum
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_pressure_Pa: 137037.35714966498
