versioning:
  package_version: 7.1.127
  config_schema_version: 8
  loaded_config_schema_version: 8
  migration_applied: false
test_description: 'Free-piston V57 auf Basis V56: richtungsabhaengiges Generator-Drehmomentkennfeld
  aus A16-002-28c_TorqueToWork_Spa_V01.xlsx bei 1 Ohm. Alle bisherigen
  Generator- und Lastmodelle bleiben separat erhalten.'
modeling:
  architecture: free_piston
free_piston:
  initial_conditions:
    x0_m: 0.0456
    # previous_auto_initial_state_from_last_compression_at_x0_m: v0_m_per_s: -7.029372391773703
    v0_m_per_s: -6.908935797405747
    combustion_state:
      # previous_auto_initial_state_from_last_compression_at_x0_m: burned_fraction_0to1: 0.21142966066307003
      burned_fraction_0to1: 0.14849529900883596
      released_energy_J: 0.0
      ignition_armed: false
      injection_armed: false
      # previous_auto_initial_state_from_last_compression_at_x0_m: burned_mass_percent: 21.142966066307004
      burned_mass_percent: 14.849529900883596
  mechanics:
    kinematics_type: oscillating_rotary
    moving_mass_kg: 100.11  # 11.8 x 2 
    piston_diameter_m: 0.085
    compression_ratio: 50
    x_min_m: 0.0
    x_max_m: 0.0911
    angle_min_deg: 0.0
    angle_max_deg: 18.0
    effective_radius_m: 0.290   #0.344/2
    rotary_inertia_kg_m2: 1.3   # V56: vorgegebene rotatorische Gesamttraegheit [kg m2].
  friction:
    model: coulomb_viscous
    fc_N: 80.0
    cv_Ns_per_m: 0
  load:
    model: generator_torque_map
    damping_Ns_per_m: 0.0       # Grunddaempfung der zusaetzlichen V56-Endlagensicherung.
    max_damping_Ns_per_m: 9000  # V56-Endlagensicherung bleibt zusaetzlich zum Kennfelddrehmoment aktiv.
    control_zone_m: 0.014       # Regelzone der Endlagensicherung nahe beiden Totpunkten [m].
    torque_map:
      file: ../A16-002-28c_TorqueToWork_Spa_V01.xlsx
      load_resistance_ohm: 0.5  # Vorhandene Kennblaetter: 0.3, 0.5, 1, 2, 5 und 10 Ohm.
      angle_at_x_min_deg: 9.0   # Simulationswinkel 0 deg / x_min entspricht Rotor 1 bei +9 deg.
      angle_at_x_max_deg: -9.0  # Simulationswinkel 18 deg / x_max entspricht Rotor 1 bei -9 deg.
      include_no_load_torque: true  # Magnetisches Leerlaufmoment aus Blatt "No Load" mitverwenden.
      angle_out_of_range: clamp     # Kleine numerische Ueberschreitungen an den Endpunkten begrenzen.
      resistance_out_of_range: error
      max_abs_torque_Nm: 1800.0
      max_electrical_power_W: 25000.0
  scavenging:
    enabled: true
    model: overlap_short_circuit_0d
    scavenging_factor: 1.25
    max_trapping_efficiency: 0.92
    short_circuit_start_ratio: 0.7
    short_circuit_slope: 0.35
    max_short_circuit_fraction: 0.35
    min_residual_fraction: 0.03
preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0
    thermo_model: promo
  features:
    mass_flow: true
    wall_heat: true
    combustion: true
    evaporation: false
    pv_work: true
  engine:
    cycle_type: 2t
    speed_rpm: 25.0
  submodels:
    volumes:
      cylinder_free_piston:
        type: cylinder
        kinematics:
          type: crank_slider
          bore_m: 1.0745
          stroke_m: 1.08
          conrod_m: 1.12
          compression_ratio: 50.0
          phase_deg: 0.0
        # V38: Das dynamische Wandtemperaturmodell ist ausgeschaltet.
        # Dadurch wird ausschliesslich wall_heat.wall_temperature_K verwendet.
        wall_temperature:
          ref: fixed_wall_temperature
        wall_heat:
          ref: woschni_promo_wall
        combustion:
          ref: vibe_lambda_slot
        evaporation:
          model: none
      compressor_bounce:
        type: bounce_chamber
        model: gas_exchange
        initial_burned_fraction_0to1: 0.0
        chamber_diameter_m: 0.075
        chamber_length_m: 0.0911
        compression_ratio: 16
        polytropic_exponent: 1.3
        # V40: eigener Wandwaermeansatz fuer die bewegte Kompressorkammer.
        wall_heat:
          ref: woschni_promo_compressor_wall
      receiver_plenum:
        type: plenum
        fixed_volume_m3: 0.00048
        wall_heat:
          model: none
        combustion:
          model: none
        evaporation:
          model: none
      intake_plenum:
        type: plenum
        fixed_volume_m3: 0.00158633
        wall_heat:
          model: none
        combustion:
          model: none
        evaporation:
          model: none
      exhaust_plenum:
        type: plenum
        fixed_volume_m3: 0.00260279
        wall_heat:
          model: none
        combustion:
          model: none
        evaporation:
          model: none
      ambient_environment:
        type: environment
        pressure_Pa: 101325.0
        temperature_K: 300.0
    wall_temperature:
      # "none" deaktiviert die Berechnung zyklusgemittelter Temperaturen.
      # Bei model: none sind keine Zonen-, Kuehlmittel- oder Relaxationswerte erlaubt.
      fixed_wall_temperature:
        model: none
    wall_heat:
      woschni_promo_wall:
        model: woschni
        variant: promo
        # Einzige wirksame Wandtemperatur in V38, konstant fuer den gesamten Zyklus.
        # Kopf, Kolben und Laufbuchse verwenden gemeinsam diesen Wert.
        wall_temperature_K: 450.0
        wall_area_m2: 0.03
        dp_mode: 'off'
        multiplier: 5
        reference_state_mode: none
        phase_mode: promo
        c1: 2.28
        c2: 0.00324
        c3: 0.0
        cucm: 0.0
        swirl_number: 0.0
        imep_bar: 0.0
      # Empirischer Woschni-PROMO-Ansatz fuer die Bounce-Kompressoren.
      # Der Code verwendet den realen Kammerdurchmesser (0.07 m) und den
      # Betrag der momentanen Kolbengeschwindigkeit als Geschwindigkeitsmass.
      woschni_promo_compressor_wall:
        model: woschni
        variant: promo
        # Konstante, gemeinsame Innenwandtemperatur beider Kompressoren.
        wall_temperature_K: 350.0
        # Naeherung: zwei Stirnflaechen plus Mantelflaeche bei maximaler Laenge.
        # Dieser Wert und der Multiplikator sind gegen Messdaten zu kalibrieren.
        wall_area_m2: 0.0315
        dp_mode: 'off'
        multiplier: 1.0
        reference_state_mode: none
        phase_mode: promo
        c1: 2.28
        c2: 0.00324
        c3: 0.0
        cucm: 0.0
        swirl_number: 0.0
        imep_bar: 0.0
    combustion:
      vibe_lambda_slot:
        model: vibe
        start_mode: hign_position
        duration_mode: time
        hign_mm: 4 #12.65
        duration_ms: 10.0
        a: 6.9
        m: 2.0
        energy_coupling: none
        fueling_mode: lambda_from_cylinder_mass_at_slot_close
        lambda_target: 1.0
        lhv_J_per_kg: 43000000.0
        afr_stoich_kg_air_per_kg_fuel: 14.5
        combustion_efficiency_0to1: 1.0
        slot_open_threshold_m2: 1.0e-07
        slot_closed_threshold_m2: 1.0e-12
        compression_velocity_threshold_m_per_s: 0.02
        angle_reference: absolute
        hcci_diagnostics_ref: ignition_diag_beck_2003_1_arrhenius
    ignition:
      ignition_diag_beck_2003_1_arrhenius:
        model: beck_2003_1_arrhenius                         # Beck-HCCI-Modell mit einer Arrhenius-Stufe; zulässig ist hier nur beck_2003_1_arrhenius.
        beck_c1_s: 1.47044752e-05                            # Fit Zylinder 1: LW=1 beim ersten Erreichen von T>=1123.15 K und p>=30 bar.
        beck_c2: -1.2                                       # Druckexponent in (p/p_ref)^c2: negativer = stärkere Verkürzung bei steigendem Druck; typisch ca. -2.5 ... -0.3.
        beck_reference_pressure_bar: 1.0                    # Bezugsdruck p_ref zur Normierung des Druckterms; sinnvoll ca. 0.8 ... 1.2 bar, üblicherweise 1.0 bar und nicht als Fitparameter verwenden.
        beck_reference_o2_percent: 20.94                    # O2-Anteil frischer Luft zur Normierung des Verdünnungsterms; sinnvoll ca. 20.0 ... 21.0 %, Standard-Trockenluft 20.94 %.
        tau_activation_temperature_K: 5000.0                # Arrhenius-Aktivierungstemperatur im Fallback exp(T_A/T); sinnvoll ca. 3000 ... 20000 K. Beim Beck-Pfad wird derzeit vorrangig die intern hinterlegte Aktivierungsenergie des Kraftstoffs verwendet.
        tau_reference_pressure_Pa: 1000000.0                # Kompatibilitätsparameter des allgemeinen Livengood-Wu-Modells; sinnvoll ca. 1e5 ... 2e6 Pa, im Beck-2003-1-Arrhenius-Verzug derzeit ohne Wirkung.
        tau_reference_lambda: 1.0                           # Kompatibilitäts-Bezugslambda; sinnvoll ca. 0.8 ... 3.0, im Beck-Modell derzeit ohne Wirkung, da dort der O2-Verdünnungsterm verwendet wird.
        lambda_slowdown_exponent: 0.7                       # Kompatibilitäts-Exponent für Lambda-Verlangsamung; sinnvoll ca. 0.0 ... 2.0, im Beck-Modell derzeit ohne Wirkung.
        residual_slowdown_factor: 1.5                       # Multiplikator bei 100 % Restgas, linear mit Restgasanteil interpoliert: 1 = kein Einfluss; sinnvoll ca. 1.0 ... 3.0.
        start_temperature_min_K: 780.0                      # Beginn der Vorakkumulation vor dem Zielpunkt.
        start_pressure_min_Pa: 2000000.0                    # Beginn der Vorakkumulation ab 20 bar absolut.
        max_ignition_delay_s: 0.1                           # Nicht begrenzend innerhalb des verwendeten Fitfensters.
        accumulation_start_mode: compression                # Akkumulation nur im Verdichtungshub.
        accumulation_end_mode: none                         # Reiner Diagnosepfad: nicht durch das Ende der vorgegebenen Vibe-Verbrennung begrenzen; Ende weiterhin spätestens mit dem Verdichtungshub.
    connections:
      compressor_in_check_valve:
        type: check_valve
        diameter_mm: 55
        discharge_coefficient: 0.82
        cracking_pressure_Pa: 0.0
      compressor_out_check_valve:
        type: check_valve
        diameter_mm: 55.3
        discharge_coefficient: 0.82
        cracking_pressure_Pa: 10000.0
      transfer_slot:
        type: slot
        source_of_data: rectangle
        opening_mode: by_distance
        distance_from_tdc_mm: 70.86 #77.61
        piston_height_if_crankcase_m: 0.0
        entrance_angle_deg: 0.0
        width_mm: 26.0
        height_mm: 20.24
        open_fillet_radius_m: 0.0
        full_fillet_radius_m: 0.0
        number_of_identical_holes: 3
        discharge_coefficients:
          mode: constant
          forward_cd: 0.95
          reverse_cd: 0.95
      exhaust_slot:
        type: slot
        source_of_data: rectangle
        opening_mode: by_distance
        distance_from_tdc_mm: 55.68 #76.38
        piston_height_if_crankcase_m: 0.0
        entrance_angle_deg: 0.0
        width_mm: 24
        height_mm: 35.42
        open_fillet_radius_m: 0.0
        full_fillet_radius_m: 0.0
        number_of_identical_holes: 3
        discharge_coefficients:
          mode: constant
          forward_cd: 0.95
          reverse_cd: 0.95
      exhaust_bleed:
        type: orifice
        diameter_mm: 14.0
        forward_cd: 0.98
        reverse_cd: 0.98
  environment:
  - name: ambient_in
    ref: ambient_environment
  - name: ambient_out
    ref: ambient_environment
  volumes:
    - name: cylinder_1
      ref: cylinder_free_piston
      combustion:
        ref: vibe_lambda_slot
        hcci_diagnostics_ref: ignition_diag_beck_2003_1_arrhenius
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_pressure_Pa: 767597.3344845708
      initial_pressure_Pa: 753795.8586952104
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_temperature_K: 882.1100351606124
      initial_temperature_K: 730.3320541055465
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_burned_fraction_0to1: 0.21142966066307003
      initial_burned_fraction_0to1: 0.14849529900883596
      type: cylinder
      kinematics:
        type: crank_slider
        bore_m: 1.0745
        stroke_m: 1.08
        conrod_m: 1.12
        compression_ratio: 50.0
        phase_deg: 0.0
      # Keine dynamische Wandtemperatur fuer Zylinder 1.
      # Der feste Wert 450 K kommt aus dem referenzierten Woschni-Modell.
      wall_temperature:
        ref: fixed_wall_temperature
        model: none
      wall_heat:
        ref: woschni_promo_wall
      evaporation:
        model: none

      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_burned_mass_percent: 21.142966066307004
      initial_burned_mass_percent: 14.849529900883596
    - name: cylinder_2
      ref: cylinder_free_piston
      combustion:
        ref: vibe_lambda_slot
        hcci_diagnostics_ref: ignition_diag_beck_2003_1_arrhenius
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_pressure_Pa: 135301.1905176817
      initial_pressure_Pa: 134392.8802091391
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_temperature_K: 1062.4593274141475
      initial_temperature_K: 1048.103346840811
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_burned_fraction_0to1: 0.5601850516435841
      initial_burned_fraction_0to1: 0.5572131373147726
      type: cylinder
      kinematics:
        type: crank_slider
        bore_m: 1.0745
        stroke_m: 1.08
        conrod_m: 1.12
        compression_ratio: 50.0
        phase_deg: 0.0
      # Keine dynamische Wandtemperatur fuer Zylinder 2.
      # Der feste Wert 450 K kommt aus dem referenzierten Woschni-Modell.
      wall_temperature:
        ref: fixed_wall_temperature
