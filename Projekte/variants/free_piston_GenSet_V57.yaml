      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_temperature_K: 1046.7260845471965
      initial_temperature_K: 1078.189899174025
      # previous_auto_initial_state_from_last_compression_at_x0_m: initial_burned_fraction_0to1: 0.473993330001501
      initial_burned_fraction_0to1: 0.4726032947324183
      type: plenum
      fixed_volume_m3: 0.00260279
      wall_heat:
        model: none
      combustion:
        model: none
      evaporation:
        model: none
