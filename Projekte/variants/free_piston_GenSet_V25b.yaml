simulation:
  dt_s: 1.0e-05                                                                                                                                                               # Integrationszeitschritt in s.
  total_cycles: 3                                                                                                                                                             # Anzahl simulierter Zyklen.
  save_last_cycles: 2                                                                                                                                                         # Anzahl zu speichernder letzter Zyklen.
  simulationtime: 0.2                                                                                                                                                         # Simulationsdauer in s.
  solver:
    kind: rk4                                                                                                                                                                 # Numerischer Integrator.
    rtol: 1.0e-05                                                                                                                                                             # Relative Solver-Toleranz.
    atol: 1.0e-07                                                                                                                                                             # Absolute Solver-Toleranz.
postprocessing:
  mode: pipeline
  config: postprocessing.yaml

  auto_update_initial_conditions: false                                                                                                                                        # Schreibt Startwerte aus letztem Lauf zurueck.
  csv_enabled: true                                                                                                                                                           # Aktiviert Haupt-CSV-Ausgabe.
  csv_path: results/free_piston_GenSet_V25.csv                                                                                                                                # Pfad der Haupt-CSV relativ zum Projekt.
  csv_separator: ;                                                                                                                                                            # Trennzeichen der CSV-Datei.
  csv_export_layout: thermo0d_signal_export_layout.csv                                                                                                                        # Optionale Signal-Auswahldatei aus dem Alias-Editor.
  csv_export_mode: all                   # auto | all | selected                                                                                                                                                 # auto nutzt vorhandenes Layout, all exportiert alles, selected erzwingt Layout.
  csv_export_missing_layout: warn_all         # warn_all | fail                                                                                                                                # Verhalten, wenn selected aktiv ist und kein Layout gefunden wird.
  csv_export_unknown_signals: warn_empty      # warn_empty | fail                                                                                                                                # Verhalten bei Layout-Signalen, die im Ergebnis nicht existieren.


