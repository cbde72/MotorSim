name: Free-Piston Species Transport Detail
style:
  preset_name: Light Engineering
  font_family: DejaVu Sans
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  subplot_title_visible: true
  figure_title_visible: false
  grid_visible: true
  grid_alpha: 0.3
  legend_visible: true
  legend_position: best
  tight_layout: true
  default_line_width: 0.9
  default_marker_size: 3.5
figures:
- title: Species Transport - Slots
  rows: 1
  cols: 1
  subplots:
  - title: Gesamt-, Luft-, Burned- und Restgasstrom
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_flow
      title: Massenstrom [g/s]
      side: left
      color: '#111111'
      limit_mode: auto
    series:
    - signal_key: transfer_slot_1_mdot_kg_per_s
      label: transfer total
      axis_id: ax_flow
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: transfer_slot_1_mdot_air_kg_per_s
      label: transfer air
      axis_id: ax_flow
      color: '#12b76a'
      line_style: '--'
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: exhaust_slot_1_mdot_kg_per_s
      label: exhaust total
      axis_id: ax_flow
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: exhaust_slot_1_mdot_burned_kg_per_s
      label: exhaust burned
      axis_id: ax_flow
      color: '#f79009'
      line_style: '--'
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: exhaust_slot_1_mdot_residual_kg_per_s
      label: exhaust residual
      axis_id: ax_flow
      color: '#7a5af8'
      line_style: ':'
      scale_factor: 1000.0
      unit_preset: raw

- title: Species Transport - Plena Inventar
  rows: 1
  cols: 1
  subplots:
  - title: Receiver / Exhaust Plenum Restgasanteile
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_frac
      title: Anteil [-]
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -0.05
      y_max: 1.05
    series:
    - signal_key: receiver_1_share_fresh_gas_0to1
      label: receiver fresh gas
      axis_id: ax_frac
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: receiver_1_share_residual_0to1
      label: receiver residual
      axis_id: ax_frac
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: exhaust_plenum_1_share_residual_0to1
      label: exhaust residual
      axis_id: ax_frac
      color: '#b42318'
      line_style: '--'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: exhaust_plenum_1_share_burned_0to1
      label: exhaust burned
      axis_id: ax_frac
      color: '#f79009'
      line_style: '--'
      scale_factor: 1.0
      unit_preset: raw

- title: Species Transport - Bilanzsanity
  rows: 1
  cols: 1
  subplots:
  - title: Gesamtinventar und Zylinderkomponenten
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mass
      title: Masse [mg]
      side: left
      color: '#111111'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_m_kg
      label: cylinder total
      axis_id: ax_mass
      color: '#111111'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_fresh_gas_kg
      label: fresh gas
      axis_id: ax_mass
      color: '#175cd3'
      line_style: '--'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_burned_kg
      label: burned total
      axis_id: ax_mass
      color: '#b42318'
      line_style: '--'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_fuel_vapor_kg
      label: fuel vapor
      axis_id: ax_mass
      color: '#027a48'
      line_style: ':'
      scale_factor: 1000000.0
      unit_preset: raw

