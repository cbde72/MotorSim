  include_kinds: [raw, reconstructed, derivative, integral]  # raw | reconstructed | derivative | integral
  remove_zero_columns: false                                # Keep selected diagnostics even if they are zero in one run.
  zero_tolerance: 0.0                                       # Absolute threshold for zero-column filtering.
  keep_zero_selected: false                                 # If true, selected signals survive zero filtering.

# Main selected-signal CSV. This is the primary pipeline export used by the plot
# renderer and offline checks.
csv:
  enabled: true
  path: csv/signals.csv
  separator: ;
  include_units_row: true
  include_kind_row: true

# Generated result CSV with the full set of available generated signals.
results:
  enabled: true
  path: csv/results.csv
  include_units_row: true
  include_kind_row: true

# Free-piston last complete UT-OT-UT window, resampled onto a normalized axis.
# This is the preferred data source for compact final-cycle plots.
last_ut_ot_ut:
  enabled: true
  path: csv/signals_last_ut_ot_ut.csv
  step_deg: 0.1
  axis_min_deg: -9.0
  axis_max_deg: 9.0
  axis_signal: theta_deg

# Reconstruct engineering signals from raw states when they are requested.
reconstruction:
  enabled: true
  only_selected: true

# Cycle integrals for last-cycle energy and wall-heat plots.
integrals:
  enabled: true
  only_selected: true
  cycle_mode: full_run
  absolute_heat_loss: true

# Run summary and README output. README.md also contains the geometry and signal
# notes generated from the current bundle.
summary:
  enabled: true
  path: summary/run_summary.yaml
  text_path: summary/run_summary.txt
  markdown_path: README.md

# Plot rendering controlled by the pipeline. The top-level plot set uses the
# full selected CSV; last_ut_ot_ut uses the final UT-OT-UT CSV above.
plots:
  enabled: true
  # Kompakter V40-Pruefplot fuer Energie, Leistung, HTC und Temperaturen.
  layout_path: plot_total
  output_dir: plots_total
  prefix: null
  clean: true
  last_ut_ot_ut:
    enabled: true
    # Kompakter V40-Pruefplot fuer Energie, Leistung, HTC und Temperaturen
    layout_path: plot_cycle
    output_dir: plots_cycle
    prefix: null
    clean: true

# Offline reprocessing from raw/run_raw.npz. Derivatives and reconstruction are
# allowed so the offline path can reproduce the online signal set.
offline:
  enabled: true
  allow_reconstruction: true
  allow_derivatives: true
