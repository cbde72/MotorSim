# Separate thermo0d postprocessing pipeline configuration for the V25 free-piston
# setup. The simulation YAML only selects postprocessing.mode: pipeline and points
# here via postprocessing.config.
version: 1

# Raw solver archive written during the simulation and reused by offline
# reprocessing. Keep this enabled when you want to regenerate CSVs/plots without
# rerunning the solver.
raw:
  enabled: true
  path: raw/run_raw.npz
  compression: compressed
  dtype: float32

# Signal selection for the pipeline CSV. include_kinds controls whether raw
