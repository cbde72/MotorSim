name: Geschwindigkeit, Beschleunigung und Kolbenweg über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- title: V-a-s
  rows: 1
  cols: 1
  subplots:
  - title: Geschwindigkeit, Beschleunigung und Kolbenweg über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_vel
      title: Geschwindigkeit [m/s]
      side: left
      color: '#111111'
    - id: ax_acc
      title: Beschleunigung [m/s²]
      side: right
      color: '#111111'
    - id: ax_x3
      title: Kolbenweg [mm] (+54 = OT, -54 = UT)
      side: right
      color: '#111111'
      limit_mode: manual
      y_min: -60.0
      y_max: 60.0
    series:
    - signal_key: free_piston_v_m_per_s
      label: Geschwindigkeit
      axis_id: ax_vel
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_a_m_per_s2
      label: Beschleunigung
      axis_id: ax_acc
      color: '#b42318'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_x_m
      label: Kolbenweg
      axis_id: ax_x3
      color: '#027a48'
      line_style: '-'
      scale_factor: -1000.0
      unit_preset: raw
      offset: 54.04
