versioning:
  package_version: 7.1.124
  config_schema_version: 8
  loaded_config_schema_version: 0
  migration_applied: true
name: Zylinder Massenanteile - letztes Arbeitsspiel
style_sheet: ../../plot_style_sheet.yaml
figures:
- title: last_ut_ot_ut_mass_shares
  rows: 1
  cols: 1
  subplots:
  - title: Zylinder Massenanteile - letztes Arbeitsspiel
    plot_type: line
    x_signal: theta_deg
    x_title: UT-OT-UT Fortschritt [deg]
    x_limit_mode: auto
    events:
    - x: -10.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: left
    - x: 0.0
      label: OT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: center
    - x: 10.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: right
    y_axes:
    - id: share
      title: Anteil [%]
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: 0.0
      y_max: 100.0
    series:
    - signal_key: cylinder_1_share_air_0to1
      label: Luft
      axis_id: share
      color: '#175cd3'
      line_style: '-'
      scale_factor: 100.0
    - signal_key: cylinder_1_share_fuel_vapor_0to1
      label: Kraftstoff gasfoermig
      axis_id: share
      color: '#f79009'
      line_style: '-'
      scale_factor: 100.0
    - signal_key: cylinder_1_share_fuel_liquid_0to1
      label: Kraftstoff fluessig
      axis_id: share
      color: '#12b76a'
      line_style: '-'
      scale_factor: 100.0
    - signal_key: cylinder_1_share_burned_0to1
      label: Verbrannt / Restgas
      axis_id: share
      color: '#b42318'
      line_style: '-'
      scale_factor: 100.0
