name: Volumen über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
  axis_label_size: 9
  title_size: 10
  grid_alpha: 0.3
  default_line_width: 1.4
  default_marker_size: 3.5
figures:
- title: Volumen
  rows: 1
  cols: 1
  subplots:
  - title: Volumen über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_v
      title: Volumen [cm³]
      side: left
      color: '#111111'
      limit_mode: data
    series:
    - signal_key: cylinder_1_V_m3
      label: Arbeitszylinder 1
      axis_id: ax_v
      color: '#000000'
      line_style: '-'
      line_width: 1.6
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_2_V_m3
      label: Arbeitszylinder 2
      axis_id: ax_v
      color: '#000000'
      line_style: --
      line_width: 1.6
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: compressor_1_V_m3
      label: Compressor 1
      axis_id: ax_v
      color: '#0067c5'
      line_style: '-'
      line_width: 1.6
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: compressor_2_V_m3
      label: Compressor 2
      axis_id: ax_v
      color: '#0067c5'
      line_style: --
      line_width: 1.6
      scale_factor: 1000000.0
      unit_preset: raw
