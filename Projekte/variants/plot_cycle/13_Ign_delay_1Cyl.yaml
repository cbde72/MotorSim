name: HCCI Zuendverzug - letzter UT-OT-UT-Zyklus
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.0
figures:
- title: last_ut_ot_ut_hcci_ignition_delay
  rows: 1
  cols: 1
  subplots:
  - title: HCCI Zuendverzug - letzter UT-OT-UT-Zyklus
    plot_type: line
    x_signal: theta_deg
    x_title: Schwingwinkel [deg]
    x_limit_mode: manual
    x_min: -9.0
    x_max: 9.0
    x_tick_step: 1.0
    x_tick_label_mode: last_ut_ot_ut
    x_axis_position: bottom
    text_box:
      enabled: true
      source: data
      title: HCCI Kennwerte
      x: 0.02
      y: 0.98
      ha: left
      va: top
      font_size: 7.0
      facecolor: '#ffffff'
      edgecolor: '#111111'
      alpha: 0.88
      metrics:
      - label: Z1 LW p
        signal_key: cylinder_1_p_Pa
        mode: first_where
        where_signal: cylinder_1_hcci_ignition_integral
        where_gte: 1.0
        scale_factor: 1.0e-5
        unit: bar
        digits: 2
      - label: Z1 LW T
        signal_key: cylinder_1_T_K
        mode: first_where
        where_signal: cylinder_1_hcci_ignition_integral
        where_gte: 1.0
        unit: K
        digits: 0
        fixed: true
      - label: Z1 Zuend p
        signal_key: cylinder_1_p_Pa
        mode: first_where
        where_signal_any:
        - cylinder_1_combustion_active_0to1
        - cylinder_1_added_energy_W
        - cylinder_1_combustion_fraction_0to1
        where_gt: 0.0
        scale_factor: 1.0e-5
        unit: bar
        digits: 2
      - label: Z1 Zuend T
        signal_key: cylinder_1_T_K
        mode: first_where
        where_signal_any:
        - cylinder_1_combustion_active_0to1
        - cylinder_1_added_energy_W
        - cylinder_1_combustion_fraction_0to1
        where_gt: 0.0
        unit: K
        digits: 0
        fixed: true
    y_axes:
    - id: tau
      title: Zuendverzug [ms]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: integral
      title: Livengood-Wu Integral [-]
      side: right
      color: '#475467'
      limit_mode: manual
      y_min: 0
      y_max: 10
    - id: volume
      title: Volumen [cm3]
      side: right
      color: '#7a5af8'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_hcci_ignition_delay_s
      label: Zyl. 1 t
      axis_id: tau
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000.0
      hide_before_positive_signal: cylinder_1_hcci_ignition_integral
    - signal_key: cylinder_1_hcci_ignition_integral
      label: Zyl. 1 LW.
      axis_id: integral
      color: '#f79009'
      line_style: --
    - signal_key: cylinder_1_V_m3
      label: Zyl. 1 V
      axis_id: volume
      color: '#7a5af8'
      line_style: ':'
      scale_factor: 1000000.0
    