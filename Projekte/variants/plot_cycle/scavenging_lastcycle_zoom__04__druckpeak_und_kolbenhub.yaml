name: Druckpeak und Kolbenhub
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.9
  default_marker_size: 3.5
figures:
- title: Last-Cycle Zoom - Zusammensetzung und Peak
  rows: 1
  cols: 1
  subplots:
  - title: Druckpeak und Kolbenhub
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: manual
    x_min: 0.88
    x_max: 1.0
    y_axes:
    - id: ax_p
      title: Druck [bar]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: ax_hub
      title: Hub [mm]
      side: right
      color: '#667085'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_p_Pa
      label: cylinder p
      axis_id: ax_p
      color: '#b42318'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
    - signal_key: receiver_1_p_Pa
      label: receiver p
      axis_id: ax_p
      color: '#175cd3'
      line_style: --
      scale_factor: 1.0e-05
      unit_preset: raw
    - signal_key: exhaust_plenum_1_p_Pa
      label: exhaust plenum p
      axis_id: ax_p
      color: '#7a5af8'
      line_style: --
      scale_factor: 1.0e-05
      unit_preset: raw
    - signal_key: free_piston_distance_from_tdc_m
      label: dist to TDC
      axis_id: ax_hub
      color: '#027a48'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
