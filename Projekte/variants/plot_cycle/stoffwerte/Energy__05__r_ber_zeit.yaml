name: R über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- title: R_t
  rows: 1
  cols: 1
  subplots:
  - title: R über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    y_axes:
    - id: ax_R
      title: R [J/(kg K)]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_R_J_per_kgK
      label: Zylinder R
      axis_id: ax_R
      color: '#b42318'
      line_style: '-'
    - signal_key: compressor_1_R_J_per_kgK
      label: Bounce R
      axis_id: ax_R
      color: '#175cd3'
      line_style: --
