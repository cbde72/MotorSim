name: Kolbenweg über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
  axis_label_size: 9
  title_size: 10
  grid_alpha: 0.3
  default_line_width: 1.4
  default_marker_size: 3.5
figures:
- title: Kolbenweg
  rows: 1
  cols: 1
  subplots:
  - title: Kolbenweg über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_x
      title: Kolbenweg [mm] (+54 = OT, -54 = UT)
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -60.0
      y_max: 60.0
    y_lines:
    - y: 54.0
      label: OT
      axis_id: ax_x
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.9
      show_label: true
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      label_font_size: 7
    - y: -54.0
      label: UT
      axis_id: ax_x
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.9
      show_label: true
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      label_font_size: 7
    series:
    - signal_key: cylinder_1_piston_x_m
      label: Arbeitszylinder 1
      axis_id: ax_x
      color: '#000000'
      line_style: '-'
      line_width: 1.6
      scale_factor: -1000.0
      offset: 54.04
      unit_preset: raw
    - signal_key: cylinder_2_piston_x_m
      label: Arbeitszylinder 2
      axis_id: ax_x
      color: '#000000'
      line_style: --
      line_width: 1.6
      scale_factor: -1000.0
      offset: 54.04
      unit_preset: raw
    - signal_key: compressor_1_piston_x_m
      label: Compressor 1
      axis_id: ax_x
      color: '#0067c5'
      line_style: '-'
      line_width: 1.6
      scale_factor: -1000.0
      offset: 54.04
      unit_preset: raw
    - signal_key: compressor_2_piston_x_m
      label: Compressor 2
      axis_id: ax_x
      color: '#0067c5'
      line_style: --
      line_width: 1.6
      scale_factor: -1000.0
      offset: 54.04
      unit_preset: raw
