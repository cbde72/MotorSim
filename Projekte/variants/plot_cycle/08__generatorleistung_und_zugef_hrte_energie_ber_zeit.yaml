name: Generatorleistung und zugeführte Energie über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- title: Power
  rows: 1
  cols: 1
  subplots:
  - title: Generatorleistung und zugeführte Energie über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_pow
      title: Leistung [W]
      side: left
      color: '#111111'
    series:
    - signal_key: free_piston_generator_power_W
      label: Generatorleistung
      axis_id: ax_pow
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_added_energy_W
      label: Zugeführte Energie
      axis_id: ax_pow
      color: '#027a48'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_wall_heat_W
      label: Wandwärme Verluste
      axis_id: ax_pow
      color: '#FF0000'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
