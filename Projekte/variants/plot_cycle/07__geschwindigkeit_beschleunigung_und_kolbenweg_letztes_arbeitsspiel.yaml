versioning:
  package_version: 7.1.124
  config_schema_version: 8
  loaded_config_schema_version: 0
  migration_applied: true
name: Geschwindigkeit, Beschleunigung und Kolbenweg - letztes Arbeitsspiel
style_sheet: ../../plot_style_sheet.yaml
figures:
- title: last_ut_ot_ut_motion
  rows: 1
  cols: 1
  subplots:
  - title: Geschwindigkeit, Beschleunigung und Kolbenweg - letztes Arbeitsspiel
    plot_type: line
    x_signal: theta_deg
    x_title: UT-OT-UT Fortschritt [deg]
    x_limit_mode: auto
    events:
    - x: -10.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: left
    - x: 0.0
      label: OT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: center
    - x: 10.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: right
    y_axes:
    - id: v
      title: Geschwindigkeit [m/s]
      side: left
      color: '#175cd3'
    - id: a
      title: Beschleunigung [m/s2]
      side: right
      color: '#b42318'
    - id: x
      title: Kolbenweg [mm]
      side: right
      color: '#027a48'
      limit_mode: manual
      y_min: -60.0
      y_max: 60.0
    series:
    - signal_key: free_piston_v_m_per_s
      label: Geschwindigkeit
      axis_id: v
      color: '#175cd3'
      line_style: '-'
    - signal_key: free_piston_a_m_per_s2
      label: Beschleunigung
      axis_id: a
      color: '#b42318'
      line_style: '-'
    - signal_key: free_piston_x_m
      label: Kolbenweg
      axis_id: x
      color: '#027a48'
      line_style: '-'
      scale_factor: -1000.0
      offset: 54.04
