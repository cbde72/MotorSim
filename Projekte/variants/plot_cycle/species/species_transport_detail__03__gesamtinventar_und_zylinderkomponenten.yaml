name: Gesamtinventar und Zylinderkomponenten
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.9
  default_marker_size: 3.5
figures:
- title: Species Transport - Bilanzsanity
  rows: 1
  cols: 1
  subplots:
  - title: Gesamtinventar und Zylinderkomponenten
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mass
      title: Masse [mg]
      side: left
      color: '#111111'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_m_kg
      label: cylinder total
      axis_id: ax_mass
      color: '#111111'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_fresh_gas_kg
      label: fresh gas
      axis_id: ax_mass
      color: '#175cd3'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_burned_kg
      label: burned total
      axis_id: ax_mass
      color: '#b42318'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_fuel_vapor_kg
      label: fuel vapor
      axis_id: ax_mass
      color: '#027a48'
      line_style: ':'
      scale_factor: 1000000.0
      unit_preset: raw
