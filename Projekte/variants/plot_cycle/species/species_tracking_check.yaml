name: Fresh gas, burned gas and residual gas in cylinder
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: Species - Cylinder Masses
  rows: 1
  cols: 1
  subplots:
  - title: Fresh gas, burned gas and residual gas in cylinder
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mass
      title: Mass [mg]
      side: left
      color: '#111111'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_m_fresh_gas_kg
      label: fresh gas
      axis_id: ax_mass
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_m_burned_kg
      label: burned total
      axis_id: ax_mass
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_m_residual_kg
      label: residual
      axis_id: ax_mass
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_m_fresh_burned_kg
      label: fresh burned
      axis_id: ax_mass
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
      line_width: 1.6
    show_title: true
