versioning:
  package_version: 7.1.124
  config_schema_version: 8
  loaded_config_schema_version: 0
  migration_applied: true
name: Kolbenweg y1, Oeffnungsquerschnitte y2, Massenstrom y3 - letztes Arbeitsspiel
style_sheet: ../../plot_style_sheet.yaml
figures:
- title: last_ut_ot_ut_piston_area_mdot
  rows: 1
  cols: 1
  subplots:
  - title: Kolbenweg y1, Oeffnungsquerschnitte y2, Massenstrom y3 - letztes Arbeitsspiel
    plot_type: line
    x_signal: theta_deg
    x_title: UT-OT-UT Fortschritt [deg]
    x_limit_mode: auto
    events:
    - x: -10.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: left
    - x: 0.0
      label: OT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: center
    - x: 10.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: right
    y_axes:
    - id: x
      title: Kolbenweg [mm]
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -60.0
      y_max: 60.0
    - id: area
      title: Freigegebener Oeffnungsquerschnitt [mm2]
      side: right
      color: '#175cd3'
    - id: mdot
      title: Massenstrom [kg/s]
      side: right
      color: '#12b76a'
    series:
    - signal_key: free_piston_x_m
      label: Kolbenweg
      axis_id: x
      color: '#111111'
      line_style: '-'
      scale_factor: -1000.0
      offset: 54.04
    - signal_key: transfer_slot_1_A_eff_forward_m2
      label: Transfer Querschnitt
      axis_id: area
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000.0
    - signal_key: exhaust_slot_1_A_eff_forward_m2
      label: Auslass Querschnitt
      axis_id: area
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000.0
    - signal_key: transfer_slot_1_mdot_kg_per_s
      label: Einstroemender Massenstrom
      axis_id: mdot
      color: '#12b76a'
      line_style: '-'
    - signal_key: exhaust_slot_1_mdot_kg_per_s
      label: Ausstroemender Massenstrom
      axis_id: mdot
      color: '#f79009'
      line_style: '-'
