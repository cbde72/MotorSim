name: Kräfte über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- title: Forces
  rows: 1
  cols: 1
  subplots:
  - title: Kräfte über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_f
      title: Kraft [N]
      side: left
      color: '#111111'
    series:
    - signal_key: free_piston_F_gas_N
      label: Gaskraft
      axis_id: ax_f
      color: '#b42318'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_F_bounce_N
      label: Bounce-Kraft
      axis_id: ax_f
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_F_friction_N
      label: Reibkraft
      axis_id: ax_f
      color: '#f79009'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_F_load_N
      label: Lastkraft
      axis_id: ax_f
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_F_net_N
      label: Nettokraft
      axis_id: ax_f
      color: '#027a48'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
