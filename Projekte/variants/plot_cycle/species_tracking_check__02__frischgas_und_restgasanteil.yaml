name: Frischgas- und Restgasanteil
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.9
  default_marker_size: 3.5
figures:
- title: Species - Zylinder Anteile
  rows: 1
  cols: 1
  subplots:
  - title: Frischgas- und Restgasanteil
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_frac
      title: Anteil [-]
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -0.05
      y_max: 1.05
    series:
    - signal_key: cylinder_1_share_fresh_gas_0to1
      label: fresh gas share
      axis_id: ax_frac
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_share_residual_0to1
      label: residual share
      axis_id: ax_frac
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_share_burned_0to1
      label: burned share
      axis_id: ax_frac
      color: '#b42318'
      line_style: --
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_share_air_0to1
      label: air share
      axis_id: ax_frac
      color: '#12b76a'
      line_style: --
      scale_factor: 1.0
      unit_preset: raw
