      line_width: 1.8
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1000000.0
      offset: 0.0
      series_type: line
    - id: 8d29da1149e4
      signal_key: cylinder_2_m_fuel_vapor_kg
      label: cyl2 fuel vapor
