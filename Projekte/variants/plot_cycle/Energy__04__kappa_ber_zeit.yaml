name: kappa über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- title: kappa_t
  rows: 1
  cols: 1
  subplots:
  - title: kappa über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    y_axes:
    - id: ax_kappa
      title: kappa [-]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_kappa
      label: Zylinder kappa
      axis_id: ax_kappa
      color: '#b42318'
      line_style: '-'
    - signal_key: compressor_1_kappa
      label: Bounce kappa
      axis_id: ax_kappa
      color: '#175cd3'
      line_style: --
