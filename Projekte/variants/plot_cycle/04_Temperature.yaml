name: Free-Piston individual plots
figures:
- title: Free-piston temperature traces of all volumes
  rows: 1
  cols: 1
  subplots:
  - title: Temperatures over time
    plot_type: line
    x_signal: last_cycle_time_s
    x_title: Time in Last Working Cycle [s]
    x_unit_preset: raw
    x_limit_mode: auto
    x_start_at_zero: true
    x_axis_position: bottom
    y_axes:
    - id: ax_p
      title: Temperature [K]
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: 0.0
      y_max: 3000.0
    series:
    - signal_key: cylinder_1_T_K
      label: cylinder
      axis_id: ax_p
      color: '#FF8A80'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
      line_width: 1.8
    - signal_key: compressor_1_T_K
      label: bounce
      axis_id: ax_p
      color: '#667085'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
      line_width: 1.8
    - signal_key: receiver_1_T_K
      label: receiver
      axis_id: ax_p
      color: '#175CD3'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
      line_width: 1.8
    - signal_key: exhaust_plenum_1_T_K
      label: exhaust
      axis_id: ax_p
      color: '#D92D20'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
      line_width: 1.8
    show_title: true
style:
  default_line_width: 1.6
style_sheet: ../../plot_style_sheet.yaml
