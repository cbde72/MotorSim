name: Restgasabbau gegen Transfer- und Auslassstrom
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.9
  default_marker_size: 3.5
figures:
- title: Species - Spuelwirkung
  rows: 1
  cols: 1
  subplots:
  - title: Restgasabbau gegen Transfer- und Auslassstrom
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mass
      title: Restgas [mg]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: ax_flow
      title: Massenstrom [g/s]
      side: right
      color: '#667085'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_m_residual_kg
      label: residual mass
      axis_id: ax_mass
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_scavenging_transfer_in_kg_per_s
      label: transfer in
      axis_id: ax_flow
      color: '#175cd3'
      line_style: --
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: cylinder_1_scavenging_exhaust_out_kg_per_s
      label: exhaust out
      axis_id: ax_flow
      color: '#b42318'
      line_style: --
      scale_factor: 1000.0
      unit_preset: raw
