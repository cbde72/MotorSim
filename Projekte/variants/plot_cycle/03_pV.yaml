versioning:
  package_version: 7.1.124
  config_schema_version: 8
  loaded_config_schema_version: 0
  migration_applied: true
name: cylinder_1 Pressure-Volume - last BDC-TDC-BDC cycle
style_sheet: ../../plot_style_sheet.yaml
figures:
- title: last_ut_ot_ut_pv_cylinder_1
  rows: 1
  cols: 2
  subplots:
  - title: cylinder_1 Pressure-Volume - last BDC-TDC-BDC cycle
    plot_type: line
    x_signal: cylinder_1_V_m3
    x_title: Cylindervolumen [cm3]
    x_scale_factor: 1000000.0
    x_limit_mode: auto
    info_box:
      enabled: true
      kind: last_ut_ot_ut_pv
      cylinder: cylinder_1
    y_axes:
    - id: p
      title: Cylinder pressure [bar]
      side: left
      color: '#111111'
      y_min: 0.0
      y_max: 140.0
    series:
    - signal_key: cylinder_1_p_Pa
      label: Cyl. 1
      axis_id: p
      color: '#66B3FF'
      line_style: '-'
      line_width: 1.8
      scale_factor: 1.0e-05
    show_title: true
  - title: cylinder_2 Pressure-Volume - last BDC-TDC-BDC cycle
    plot_type: line
    x_signal: cylinder_2_V_m3
    x_title: Cylindervolumen [cm3]
    x_scale_factor: 1000000.0
    x_limit_mode: auto
    info_box:
      enabled: true
      kind: last_ut_ot_ut_pv
      cylinder: cylinder_2
    y_axes:
    - id: p
      title: Cylinder pressure [bar]
      side: left
      color: '#111111'
      y_min: 0.0
      y_max: 140.0
    series:
    - signal_key: cylinder_2_p_Pa
      label: Cyl. 2
      axis_id: p
      color: '#0050A4'
      line_style: '-'
      line_width: 1.8
      scale_factor: 1.0e-05
    show_title: true

style:
  default_line_width: 1.6
