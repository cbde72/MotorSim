name: Diagnose des 0D-Scavengmodells
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: Scavenging — model response
  rows: 1
  cols: 1
  subplots:
  - title: Diagnose des 0D-Scavengmodells
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_rate
      title: Rate [g/s]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: ax_frac
      title: Fraction / Eta [-]
      side: right
      color: '#111111'
      limit_mode: manual
      y_min: -0.05
      y_max: 1.05
    series:
    - signal_key: cylinder_1_scavenging_transfer_in_kg_per_s
      label: transfer_in
      axis_id: ax_rate
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_scavenging_exhaust_out_kg_per_s
      label: exhaust_out
      axis_id: ax_rate
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_scavenging_burned_correction_kg_per_s
      label: burned_correction
      axis_id: ax_rate
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_scavenging_short_circuit_fraction
      label: short_circuit
      axis_id: ax_frac
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_scavenging_efficiency_0to1
      label: eta_scav
      axis_id: ax_frac
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    show_title: true
