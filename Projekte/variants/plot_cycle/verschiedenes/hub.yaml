name: Piston position over time
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: Piston position
  rows: 1
  cols: 1
  subplots:
  - title: Piston position over time
    plot_type: line
    x_signal: last_cycle_time_s
    x_title: Time in Last Working Cycle [s]
    x_unit_preset: raw
    x_limit_mode: auto
    x_start_at_zero: true
    x_axis_position: bottom
    y_axes:
    - id: ax_x
      title: Piston position [mm] (+54 = OT, -54 = UT)
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -60.0
      y_max: 60.0
    y_lines:
    - y: 54.0
      label: OT
      axis_id: ax_x
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.9
      show_label: true
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
    - y: -54.0
      label: UT
      axis_id: ax_x
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.9
      show_label: true
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
    series:
    - signal_key: cylinder_1_piston_x_m
      label: Power cylinder 1
      axis_id: ax_x
      color: '#111111'
      line_style: --
      line_width: 1.35
      scale_factor: -1000.0
      offset: 54.04
      unit_preset: raw
    - signal_key: cylinder_2_piston_x_m
      label: Power cylinder 2
      axis_id: ax_x
      color: '#111111'
      line_style: --
      line_width: 1.35
      scale_factor: -1000.0
      offset: 54.04
      unit_preset: raw
    - signal_key: compressor_1_piston_x_m
      label: Compressor 1
      axis_id: ax_x
      color: '#111111'
      line_style: --
      line_width: 1.35
      scale_factor: -1000.0
      offset: 54.04
      unit_preset: raw
    - signal_key: compressor_2_piston_x_m
      label: Compressor 2
      axis_id: ax_x
      color: '#111111'
      line_style: --
      line_width: 1.35
      scale_factor: -1000.0
      offset: 54.04
      unit_preset: raw
    show_title: true
