name: Port release over actual mechanical angle
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.2
  font_size: 11.0
  axis_label_size: 14.0
  tick_label_size: 11.0
  title_size: 13.0
  figure_title_size: 14.0
figures:
- title: port_release_over_mechanical_angle
  rows: 2
  cols: 1
  subplots:
  - title: Port release side 1
    show_title: true
    plot_type: line
    x_signal: theta_deg
    x_title: Travel angle from TDC [deg]
    x_unit_preset: raw
    x_offset: 9.0
    x_limit_mode: manual
    x_min: 0.0
    x_max: 18.0
    x_tick_step: 1.0
    x_start_at_zero: false
    x_axis_position: bottom
    x_lines:
    - x: 11.000790
      label: 'Exhaust opens / closes: 11.00 deg from TDC / 55.68 mm'
      color: '#F79009'
      line_style: '--'
      line_width: 1.1
      label_ha: right
      label_y: 0.93
      label_font_size: 9.0
      label_rotation: 90.0
    - x: 13.999927
      label: 'Inlet opens / closes: 14.00 deg from TDC / 70.86 mm'
      color: '#175CD3'
      line_style: '--'
      line_width: 1.1
      label_ha: left
      label_y: 0.72
      label_font_size: 9.0
      label_rotation: 90.0
    y_axes:
    - id: ax_area_1
      title: Geometric opening area [mm²]
      side: left
      color: '#111111'
      limit_mode: auto
      axis_label_size: 14
      tick_label_size: 11
    y_lines:
    - y: 0.0
      label: Closed
      axis_id: ax_area_1
      color: '#667085'
      line_style: ':'
      line_width: 0.8
      alpha: 0.9
    series:
    - signal_key: exhaust_slot_1_A_geom_m2
      label: Exhaust slot 1
      axis_id: ax_area_1
      color: '#F79009'
      line_style: '-'
      line_width: 1.3
      scale_factor: 1.0e6
      unit_preset: raw
    - signal_key: transfer_slot_1_A_geom_m2
      label: Inlet/transfer slot 1
      axis_id: ax_area_1
      color: '#175CD3'
      line_style: '-'
      line_width: 1.3
      scale_factor: 1.0e6
      unit_preset: raw
  - title: Port release side 2
    show_title: true
    plot_type: line
    x_signal: theta_deg
    x_title: Travel angle from TDC [deg]
    x_unit_preset: raw
    x_offset: 9.0
    x_limit_mode: manual
    x_min: 0.0
    x_max: 18.0
    x_tick_step: 0.5
    x_start_at_zero: false
    x_axis_position: bottom
    x_lines:
    - x: 11.000790
      label: 'Exhaust opens / closes: 11.00 deg from TDC / 55.68 mm'
      color: '#F79009'
      line_style: '--'
      line_width: 1.1
      label_ha: right
      label_y: 0.93
      label_font_size: 9.0
      label_rotation: 90.0
    - x: 13.999927
      label: 'Inlet opens / closes: 14.00 deg from TDC / 70.86 mm'
      color: '#175CD3'
      line_style: '--'
      line_width: 1.1
      label_ha: left
      label_y: 0.72
      label_font_size: 9.0
      label_rotation: 90.0
    y_axes:
    - id: ax_area_2
      title: Geometric opening area [mm²]
      side: left
      color: '#111111'
      limit_mode: auto
      axis_label_size: 14
      tick_label_size: 11
    y_lines:
    - y: 0.0
      label: Closed
      axis_id: ax_area_2
      color: '#667085'
      line_style: ':'
      line_width: 0.8
      alpha: 0.9
    series:
    - signal_key: exhaust_slot_2_A_geom_m2
      label: Exhaust slot 2
      axis_id: ax_area_2
      color: '#F79009'
      line_style: '-'
      line_width: 1.3
      scale_factor: 1.0e6
      unit_preset: raw
    - signal_key: transfer_slot_2_A_geom_m2
      label: Inlet/transfer slot 2
      axis_id: ax_area_2
      color: '#175CD3'
      line_style: '-'
      line_width: 1.3
      scale_factor: 1.0e6
      unit_preset: raw
