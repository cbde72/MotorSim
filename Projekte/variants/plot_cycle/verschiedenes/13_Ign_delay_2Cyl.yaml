name: HCCI Ignition Diagnostics - Cylinder 2 - Last Working Cycle
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: hcci_ignition_diagnostics_cylinder_2
  rows: 3
  cols: 1
  subplots:
  - title: Cylinder 2 - Local Ignition Delay
    plot_type: line
    x_signal: last_cycle_time_s
    x_title: Time in Last Working Cycle [s]
    x_unit_preset: raw
    x_limit_mode: auto
    x_start_at_zero: true
    x_axis_position: bottom
    text_box:
      enabled: true
      source: data
      title: HCCI Metrics - Cylinder 2
      x: 0.98
      y: 0.98
      ha: right
      va: top
      font_size: 6.0
      facecolor: '#ffffff'
      edgecolor: '#111111'
      alpha: 0.88
      metrics:
      - label: LW=1 time
        signal_key: last_cycle_time_s
        mode: first_where
        where_signal: cylinder_2_hcci_ignition_integral
        where_gte: 1.0
        unit: s
        digits: 5
        fixed: true
      - label: LW=1 angle
        signal_key: theta_deg
        mode: first_where
        where_signal: cylinder_2_hcci_ignition_integral
        where_gte: 1.0
        unit: deg
        digits: 2
        fixed: true
      - label: LW=1 stroke
        signal_key: cylinder_2_piston_x_m
        mode: first_where
        where_signal: cylinder_2_hcci_ignition_integral
        where_gte: 1.0
        scale_factor: 1000.0
        unit: mm
        digits: 2
        fixed: true
      - label: LW=1 pressure
        signal_key: cylinder_2_p_Pa
        mode: first_where
        where_signal: cylinder_2_hcci_ignition_integral
        where_gte: 1.0
        scale_factor: 1.0e-05
        unit: bar
        digits: 2
        fixed: true
      - label: LW=1 temperature
        signal_key: cylinder_2_T_K
        mode: first_where
        where_signal: cylinder_2_hcci_ignition_integral
        where_gte: 1.0
        unit: K
        digits: 0
        fixed: true
      - label: SOC time
        signal_key: last_cycle_time_s
        mode: first_where
        where_signal_any:
        - cylinder_2_combustion_active_0to1
        - cylinder_2_added_energy_W
        where_gt: 0.0
        unit: s
        digits: 5
        fixed: true
      - label: SOC angle
        signal_key: theta_deg
        mode: first_where
        where_signal_any:
        - cylinder_2_combustion_active_0to1
        - cylinder_2_added_energy_W
        where_gt: 0.0
        unit: deg
        digits: 2
        fixed: true
      - label: SOC stroke
        signal_key: cylinder_2_piston_x_m
        mode: first_where
        where_signal_any:
        - cylinder_2_combustion_active_0to1
        - cylinder_2_added_energy_W
        where_gt: 0.0
        scale_factor: 1000.0
        unit: mm
        digits: 2
        fixed: true
      - label: SOC pressure
        signal_key: cylinder_2_p_Pa
        mode: first_where
        where_signal_any:
        - cylinder_2_combustion_active_0to1
        - cylinder_2_added_energy_W
        where_gt: 0.0
        scale_factor: 1.0e-05
        unit: bar
        digits: 2
        fixed: true
      - label: SOC temperature
        signal_key: cylinder_2_T_K
        mode: first_where
        where_signal_any:
        - cylinder_2_combustion_active_0to1
        - cylinder_2_added_energy_W
        where_gt: 0.0
        unit: K
        digits: 0
        fixed: true
    y_axes:
    - id: delay
      title: Local Ignition Delay [ms]
      side: left
      color: '#111111'
      scale: log
      limit_mode: manual
      y_min: 0.01
      y_max: 1000.0
    series:
    - signal_key: cylinder_2_hcci_ignition_delay_s
      label: Cylinder 2 Ignition Delay
      axis_id: delay
      color: '#087A6A'
      line_style: '-'
      scale_factor: 1000.0
      show_while_positive_signal: cylinder_2_hcci_accumulation_window_active_0to1
      line_width: 1.6
    show_title: true
  - title: Cylinder 2 - Livengood-Wu Integral
    plot_type: line
    x_signal: last_cycle_time_s
    x_title: Time in Last Working Cycle [s]
    x_limit_mode: auto
    x_start_at_zero: true
    y_axes:
    - id: integral
      title: Livengood-Wu Integral [-]
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: 0.0
      y_max: 1.2
    y_lines:
    - y: 1.0
      axis_id: integral
      label: Ignition threshold
      color: '#111111'
      line_style: --
      line_width: 1.0
    series:
    - signal_key: cylinder_2_hcci_ignition_integral
      label: Cylinder 2 Livengood-Wu Integral
      axis_id: integral
      color: '#087A6A'
      line_style: '-'
      line_width: 1.6
    show_title: true
  - title: Cylinder 2 - Thermodynamic State
    plot_type: line
    x_signal: last_cycle_time_s
    x_title: Time in Last Working Cycle [s]
    x_limit_mode: auto
    x_start_at_zero: true
    y_axes:
    - id: temperature
      title: Temperature [K]
      side: left
      color: '#111111'
    - id: pressure
      title: Pressure [bar]
      side: right
      color: '#111111'
    series:
    - signal_key: cylinder_2_T_K
      label: Cylinder 2 temperature
      axis_id: temperature
      color: '#B71C1C'
      line_style: '-'
      line_width: 1.8
    - signal_key: cylinder_2_p_Pa
      label: Cylinder 2 Pressure
      axis_id: pressure
      color: '#0050A4'
      line_style: '-'
      scale_factor: 1.0e-05
      line_width: 1.8
    show_title: true
