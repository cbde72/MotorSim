name: HCCI Ignitionverzug - last BDC-TDC-BDC cycle
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: last_ut_ot_ut_hcci_ignition_delay
  rows: 1
  cols: 1
  subplots:
  - title: HCCI Ignitionverzug - last BDC-TDC-BDC cycle
    plot_type: line
    x_signal: last_cycle_time_s
    x_title: Time in Last Working Cycle [s]
    x_unit_preset: raw
    x_limit_mode: auto
    x_start_at_zero: true
    x_axis_position: bottom
    text_box:
      enabled: true
      source: data
      title: HCCI Metrics - Cylinders 1 and 2
      x: 0.02
      y: 0.98
      ha: left
      va: top
      font_size: 7.0
      facecolor: '#ffffff'
      edgecolor: '#111111'
      alpha: 0.88
      metrics:
      - label: Z1 LW p
        signal_key: cylinder_1_p_Pa
        mode: first_where
        where_signal: cylinder_1_hcci_ignition_integral
        where_gte: 1.0
        scale_factor: 1.0e-05
        unit: bar
        digits: 2
      - label: Z1 LW T
        signal_key: cylinder_1_T_K
        mode: first_where
        where_signal: cylinder_1_hcci_ignition_integral
        where_gte: 1.0
        unit: K
        digits: 0
        fixed: true
      - label: Z1 Ignition p
        signal_key: cylinder_1_p_Pa
        mode: first_where
        where_signal_any:
        - cylinder_1_combustion_active_0to1
        - cylinder_1_added_energy_W
        - cylinder_1_combustion_fraction_0to1
        where_gt: 0.0
        scale_factor: 1.0e-05
        unit: bar
        digits: 2
      - label: Z1 Ignition T
        signal_key: cylinder_1_T_K
        mode: first_where
        where_signal_any:
        - cylinder_1_combustion_active_0to1
        - cylinder_1_added_energy_W
        - cylinder_1_combustion_fraction_0to1
        where_gt: 0.0
        unit: K
        digits: 0
        fixed: true
      - label: Z2 LW p
        signal_key: cylinder_2_p_Pa
        mode: first_where
        where_signal: cylinder_2_hcci_ignition_integral
        where_gte: 1.0
        scale_factor: 1.0e-05
        unit: bar
        digits: 2
      - label: Z2 LW T
        signal_key: cylinder_2_T_K
        mode: first_where
        where_signal: cylinder_2_hcci_ignition_integral
        where_gte: 1.0
        unit: K
        digits: 0
        fixed: true
      - label: Z2 Ignition p
        signal_key: cylinder_2_p_Pa
        mode: first_where
        where_signal_any:
        - cylinder_2_combustion_active_0to1
        - cylinder_2_added_energy_W
        - cylinder_2_combustion_fraction_0to1
        where_gt: 0.0
        scale_factor: 1.0e-05
        unit: bar
        digits: 2
      - label: Z2 Ignition T
        signal_key: cylinder_2_T_K
        mode: first_where
        where_signal_any:
        - cylinder_2_combustion_active_0to1
        - cylinder_2_added_energy_W
        - cylinder_2_combustion_fraction_0to1
        where_gt: 0.0
        unit: K
        digits: 0
        fixed: true
    y_axes:
    - id: tau
      title: Ignitionverzug [ms]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: integral
      title: Livengood-Wu Integral [-]
      side: right
      color: '#111111'
      limit_mode: manual
      y_min: 0
      y_max: 10
    - id: volume
      title: Volume [cm3]
      side: right
      color: '#111111'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_hcci_ignition_delay_s
      label: Zyl. 1 t
      axis_id: tau
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1000.0
      hide_before_positive_signal: cylinder_1_hcci_ignition_integral
      line_width: 1.6
    - signal_key: cylinder_2_hcci_ignition_delay_s
      label: Zyl. 2 t
      axis_id: tau
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1000.0
      hide_before_positive_signal: cylinder_2_hcci_ignition_integral
      line_width: 1.6
    - signal_key: cylinder_1_hcci_ignition_integral
      label: Zyl. 1 LW.
      axis_id: integral
      color: '#7DD3C7'
      line_style: '-'
      line_width: 1.6
    - signal_key: cylinder_2_hcci_ignition_integral
      label: Zyl. 2 LW.
      axis_id: integral
      color: '#7DD3C7'
      line_style: '-'
      line_width: 1.6
    - signal_key: cylinder_1_V_m3
      label: Zyl. 1 V
      axis_id: volume
      color: '#7DD3C7'
      line_style: --
      scale_factor: 1000000.0
      line_width: 1.05
    - signal_key: cylinder_2_V_m3
      label: Zyl. 2 V
      axis_id: volume
      color: '#7DD3C7'
      line_style: --
      scale_factor: 1000000.0
      line_width: 1.05
    show_title: true
