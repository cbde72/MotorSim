versioning:
  package_version: 7.1.124
  config_schema_version: 8
  loaded_config_schema_version: 0
  migration_applied: true
name: Fresh and burned gas in cylinder — last BDC-TDC-BDC cycle
style_sheet: ../../plot_style_sheet.yaml
figures:
- title: last_ut_ot_ut_species
  rows: 1
  cols: 1
  subplots:
  - title: Fresh and burned gas in cylinder — last BDC-TDC-BDC cycle
    plot_type: line
    x_signal: theta_deg
    x_title: UT-OT-UT progress [deg]
    x_limit_mode: auto
    events:
    - x: -10.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: left
    - x: 0.0
      label: OT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: center
    - x: 10.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: right
    y_axes:
    - id: mass
      title: Mass in cylinder [mg]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_m_fresh_gas_kg
      label: fresh gas
      axis_id: mass
      color: '#7DD3C7'
      line_style: '-'
      line_width: 1.6
      scale_factor: 1000000.0
    - signal_key: cylinder_1_m_burned_kg
      label: burned total
      axis_id: mass
      color: '#7DD3C7'
      line_style: '-'
      line_width: 1.6
      scale_factor: 1000000.0
    show_title: true
style:
  default_line_width: 1.6
