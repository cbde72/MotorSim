name: Cylinder Massesanteile over time
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: Cylinder Massesanteile over time
  rows: 1
  cols: 1
  subplots:
  - title: Cylinder Massesanteile over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_share_cylinder
      title: Fraction [%]
      side: left
      color: '#111111'
      limit_mode: auto
      min: 0.0
      max: 100.0
    series:
    - signal_key: cylinder_1_share_air_0to1
      label: Air
      axis_id: ax_share_cylinder
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 100.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_share_fuel_vapor_0to1
      label: Forcestoff vapor
      axis_id: ax_share_cylinder
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 100.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_share_fuel_liquid_0to1
      label: Forcestoff liquid
      axis_id: ax_share_cylinder
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 100.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_1_share_burned_0to1
      label: Burned gas
      axis_id: ax_share_cylinder
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 100.0
      unit_preset: raw
      line_width: 1.6
    show_title: true
