name: Zylinder Massenanteile über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- title: Zylinder Massenanteile über Zeit
  rows: 1
  cols: 1
  subplots:
  - title: Zylinder Massenanteile über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_share_cylinder
      title: Anteil [%]
      side: left
      color: '#111111'
      limit_mode: auto
      min: 0.0
      max: 100.0
    series:
    - signal_key: cylinder_1_share_air_0to1
      label: Luft
      axis_id: ax_share_cylinder
      color: '#175cd3'
      line_style: '-'
      scale_factor: 100.0
      unit_preset: raw
    - signal_key: cylinder_1_share_fuel_vapor_0to1
      label: Kraftstoff gasförmig
      axis_id: ax_share_cylinder
      color: '#f79009'
      line_style: '-'
      scale_factor: 100.0
      unit_preset: raw
    - signal_key: cylinder_1_share_fuel_liquid_0to1
      label: Kraftstoff flüssig
      axis_id: ax_share_cylinder
      color: '#12b76a'
      line_style: '-'
      scale_factor: 100.0
      unit_preset: raw
    - signal_key: cylinder_1_share_burned_0to1
      label: Verbrannt
      axis_id: ax_share_cylinder
      color: '#b42318'
      line_style: '-'
      scale_factor: 100.0
      unit_preset: raw
