name: Unverbrannte Masse über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  grid_alpha: 0.3
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- title: Unverbrannte Masse über Zeit
  rows: 1
  cols: 1
  subplots:
  - title: Unverbrannte Masse über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_m_unburned
      title: Unverbrannte Masse [mg]
      side: left
      color: '#111111'
      limit_mode: auto
      y_min: -1.0
      y_max: 11.0
    series:
    - signal_key: cylinder_1_m_unburned_kg
      label: cylinder unburned
      axis_id: ax_m_unburned
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
    - signal_key: compressor_1_m_unburned_kg
      label: bounce unburned
      axis_id: ax_m_unburned
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
    - signal_key: receiver_1_m_unburned_kg
      label: receiver unburned
      axis_id: ax_m_unburned
      color: '#027a48'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
    - signal_key: exhaust_plenum_1_m_unburned_kg
      label: exhaust_plenum unburned
      axis_id: ax_m_unburned
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
