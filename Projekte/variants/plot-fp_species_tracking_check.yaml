name: Free-Piston Species Tracking Check
style:
  preset_name: Light Engineering
  font_family: DejaVu Sans
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  subplot_title_visible: true
  figure_title_visible: false
  grid_visible: true
  grid_alpha: 0.3
  legend_visible: true
  legend_position: best
  tight_layout: true
  default_line_width: 0.9
  default_marker_size: 3.5
figures:
- title: Species - Zylinder Massen
  rows: 1
  cols: 1
  subplots:
  - title: Frischgas, verbranntes Gas und Restgas im Zylinder
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mass
      title: Masse [mg]
      side: left
      color: '#111111'
      limit_mode: auto
    series:
    - signal_key: cylinder_m_fresh_gas_kg
      label: fresh gas
      axis_id: ax_mass
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_m_burned_kg
      label: burned total
      axis_id: ax_mass
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_m_residual_kg
      label: residual
      axis_id: ax_mass
      color: '#7a5af8'
      line_style: '--'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_m_fresh_burned_kg
      label: fresh burned
      axis_id: ax_mass
      color: '#f79009'
      line_style: '--'
      scale_factor: 1000000.0
      unit_preset: raw

- title: Species - Zylinder Anteile
  rows: 1
  cols: 1
  subplots:
  - title: Frischgas- und Restgasanteil
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_frac
      title: Anteil [-]
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -0.05
      y_max: 1.05
    series:
    - signal_key: cylinder_share_fresh_gas_0to1
      label: fresh gas share
      axis_id: ax_frac
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_share_residual_0to1
      label: residual share
      axis_id: ax_frac
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_share_burned_0to1
      label: burned share
      axis_id: ax_frac
      color: '#b42318'
      line_style: '--'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_share_air_0to1
      label: air share
      axis_id: ax_frac
      color: '#12b76a'
      line_style: '--'
      scale_factor: 1.0
      unit_preset: raw

- title: Species - Spuelwirkung
  rows: 1
  cols: 1
  subplots:
  - title: Restgasabbau gegen Transfer- und Auslassstrom
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mass
      title: Restgas [mg]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: ax_flow
      title: Massenstrom [g/s]
      side: right
      color: '#667085'
      limit_mode: auto
    series:
    - signal_key: cylinder_m_residual_kg
      label: residual mass
      axis_id: ax_mass
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_scavenging_transfer_in_kg_per_s
      label: transfer in
      axis_id: ax_flow
      color: '#175cd3'
      line_style: '--'
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: cylinder_scavenging_exhaust_out_kg_per_s
      label: exhaust out
      axis_id: ax_flow
      color: '#b42318'
      line_style: '--'
      scale_factor: 1000.0
      unit_preset: raw
