  remove_zero_columns: false
  zero_tolerance: 0.0
  keep_zero_selected: false
csv:
  enabled: true
  path: csv/signals.csv
  separator: ;
  include_units_row: true
  include_kind_row: true
results:
  enabled: true
  path: csv/results.csv
  include_units_row: true
  include_kind_row: true
last_ut_ot_ut:
  enabled: true
  path: csv/signals_last_ut_ot_ut.csv
  step_deg: 0.1
  axis_min_deg: -10.0
  axis_max_deg: 10.0
  axis_signal: theta_deg
reconstruction:
  enabled: true
  only_selected: true
integrals:
  enabled: false
  only_selected: true
  cycle_mode: full_run
  absolute_heat_loss: true
summary:
  enabled: true
  path: summary/run_summary.yaml
  text_path: summary/run_summary.txt
  markdown_path: README.md
plots:
  enabled: true
  layout_path: plot_CFG
  output_dir: plots_pipeline_csv
  prefix: null
  clean: true
  last_ut_ot_ut:
    enabled: true
    layout_path: plot_CFG_last_ut_ot_ut
    output_dir: plots_pipeline_csv_last_ut_ot_ut
    prefix: null
    clean: true
offline:
  enabled: true
  allow_reconstruction: true
  allow_derivatives: true
