name: Free-Piston Einzelplots
style:
  preset_name: Light Engineering
  font_family: DejaVu Sans
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  subplot_title_visible: true
  figure_title_visible: false
  grid_visible: true
  grid_alpha: 0.3
  legend_visible: true
  legend_position: best
  tight_layout: true
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- title: p_t
  rows: 1
  cols: 1
  subplots:
  - title: Pressure
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p
      title: Druck [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_p_Pa
      label: Zylinder
      axis_id: ax_p
      color: '#b42318'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
    - signal_key: compressor_1_p_Pa
      label: Bounce
      axis_id: ax_p
      color: '#111111'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
    - signal_key: receiver_1_p_Pa
      label: Transfer
      axis_id: ax_p
      color: '#0000FF'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
- title: s_t
  rows: 1
  cols: 1
  subplots:
  - title: Kolbenweg über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_x
      limit_mode: manual
      y_min: -60.0
      y_max: 60.0
      title: Kolbenweg [mm] (+54 = OT, -54 = UT)
      side: left
      color: '#111111'
      min: -60.0
      max: 60.0
    y_lines:
    - y: -54.0
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      axis_id: ax_x
      label_font_size: 6
      show_label: true
      label: UT
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.95
    - y: 54.0
      label_font_size: 6
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      axis_id: ax_x
      show_label: true
      label: OT
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.95
    - y: -38.0
      label_position: above
      label_offset_pt: 1
      label_font_size: 4
      axis_id: ax_x
      show_label: true
      label: Intake
      color: '#0000FF'
      line_style: dotted
      line_width: 0.5
      alpha: 0.9
    - y: -36.0
      label_font_size: 4
      label_position: below
      label_offset_pt: 2
      axis_id: ax_x
      show_label: true
      label: Exhaust
      color: '#FF0000'
      line_style: dotted
      line_width: 0.5
      alpha: 0.9
    series:
    - signal_key: free_piston_x_m
      label: Kolbenweg
      axis_id: ax_x
      color: '#175cd3'
      line_style: '-'
      scale_factor: -1000.0
      unit_preset: raw
      offset: 54.04
- title: Volume
  rows: 1
  cols: 1
  subplots:
  - title: Zylindervolumen über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_v
      title: Volumen [cm³]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_V_m3
      label: Zylinder
      axis_id: ax_v
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: compressor_1_V_m3
      label: Bounce
      axis_id: ax_v
      color: '#111111'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
- title: pV
  rows: 1
  cols: 2
  subplots:
  - title: Arbeitszylinder 1
    plot_type: line
    x_signal: cylinder_1_V_m3
    x_title: Volumen [cm³]
    x_scale_factor: 1000000.0
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p_1
      title: Druck [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_p_Pa
      label: Arbeitszylinder 1
      axis_id: ax_p_1
      color: '#111111'
      line_style: '-'
      line_width: 1.0
      scale_factor: 1.0e-05
      unit_preset: raw
  - title: Arbeitszylinder 2
    plot_type: line
    x_signal: cylinder_2_V_m3
    x_title: Volumen [cm³]
    x_scale_factor: 1000000.0
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p_2
      title: Druck [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_2_p_Pa
      label: Arbeitszylinder 2
      axis_id: ax_p_2
      color: '#111111'
      line_style: '-'
      line_width: 1.0
      scale_factor: 1.0e-05
      unit_preset: raw
