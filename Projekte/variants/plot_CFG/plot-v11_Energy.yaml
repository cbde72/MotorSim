name: Free-Piston Einzelplots
figures:
- title: energy
  rows: 1
  cols: 1
  subplots:
  - title: Kolbenweg, Öffnungsquerschnitte, Massenstrom, Zugeführte Energie
    show_title: false
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    x_start_at_zero: true
    title_size: 8
    x_spans:
    - signal_key: cylinder_1_added_energy_W
      threshold: 1.0
      active_when: above
      color: '#FF0000'
      alpha: 0.12
      label: Verbrennung
      show_label: false
    - signal_key: free_piston_generator_power_W
      threshold: 1.0
      active_when: above
      color: '#97FFFF'
      alpha: 0.52
      label: Load
      show_label: false
    y_axes:
    - id: ax_x
      title: Kolbenweg [mm] (+54 = OT, -54 = UT)
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -60.0
      y_max: 60.0
      min: -60.0
      max: 60.0
      axis_label_size: 8
      tick_label_size: 6
    - id: ax_mdot
      title: Massenstrom [kg/s]
      side: right
      color: '#111111'
      axis_label_size: 8
      tick_label_size: 6
      limit_mode: manual
      y_min: -0.5
      y_max: 0.5
      min: -0.5
      max: 0.5
    - id: ax_qzu
      title: Qzu [W]
      side: right
      color: '#FF0000'
      limit_mode: manual
      y_min: 0.0
      y_max: 350000.0
      min: 0.0
      max: 350000.0
      axis_label_size: 8
      tick_label_size: 6
    y_lines:
    - y: -54.0
      axis_id: ax_x
      label: UT
      show_label: true
      label_position: center
      label_font_size: 6
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.95
    - y: 54.0
      axis_id: ax_x
      label: OT
      show_label: true
      label_position: center
      label_font_size: 6
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.95
    - y: -38.0
      axis_id: ax_x
      label: Intake
      show_label: true
      label_position: above
      label_offset_pt: 1
      label_font_size: 4
      color: '#0000FF'
      line_style: dotted
      line_width: 0.5
      alpha: 0.9
    - y: -36.0
      axis_id: ax_x
      label: Exhaust
      show_label: true
      label_position: below
      label_offset_pt: 2
      label_font_size: 4
      color: '#FF0000'
      line_style: dotted
      line_width: 0.5
      alpha: 0.9
    series:
    - signal_key: free_piston_x_m
      label: Kolbenweg
      axis_id: ax_x
      color: '#111111'
      line_style: '-'
      line_width: 1.0
      scale_factor: -1000.0
      unit_preset: raw
      offset: 54.04
    - signal_key: transfer_slot_1_mdot_kg_per_s
      label: Einströmender Massenstrom
      axis_id: ax_mdot
      color: '#12b76a'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: exhaust_slot_1_mdot_kg_per_s
      label: Ausströmender Massenstrom
      axis_id: ax_mdot
      color: '#f79009'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_added_energy_W
      label: Zugeführte Energie
      axis_id: ax_qzu
      color: '#FF0000'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1.0
      unit_preset: raw
- title: cp_t
  rows: 1
  cols: 1
  subplots:
  - title: cp über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    y_axes:
    - id: ax_cp
      title: cp [J/(kg K)]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_cp_J_per_kgK
      label: Zylinder cp
      axis_id: ax_cp
      color: '#b42318'
      line_style: '-'
    - signal_key: compressor_1_cp_J_per_kgK
      label: Bounce cp
      axis_id: ax_cp
      color: '#175cd3'
      line_style: --
- title: cv_t
  rows: 1
  cols: 1
  subplots:
  - title: cv über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    y_axes:
    - id: ax_cv
      title: cv [J/(kg K)]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_cv_J_per_kgK
      label: Zylinder cv
      axis_id: ax_cv
      color: '#b42318'
      line_style: '-'
    - signal_key: compressor_1_cv_J_per_kgK
      label: Bounce cv
      axis_id: ax_cv
      color: '#175cd3'
      line_style: --
- title: kappa_t
  rows: 1
  cols: 1
  subplots:
  - title: kappa über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    y_axes:
    - id: ax_kappa
      title: kappa [-]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_kappa
      label: Zylinder kappa
      axis_id: ax_kappa
      color: '#b42318'
      line_style: '-'
    - signal_key: compressor_1_kappa
      label: Bounce kappa
      axis_id: ax_kappa
      color: '#175cd3'
      line_style: --
- title: R_t
  rows: 1
  cols: 1
  subplots:
  - title: R über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    y_axes:
    - id: ax_R
      title: R [J/(kg K)]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_R_J_per_kgK
      label: Zylinder R
      axis_id: ax_R
      color: '#b42318'
      line_style: '-'
    - signal_key: compressor_1_R_J_per_kgK
      label: Bounce R
      axis_id: ax_R
      color: '#175cd3'
      line_style: --
- title: Free-Piston Temperaturverläufe aller Volumes
  rows: 1
  cols: 1
  subplots:
  - title: Temperaturen über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p
      title: Temperature [K]
      side: left
      color: '#111111'
      limit_mode: auto
      y_min: -1.0
      y_max: 11.0
    series:
    - signal_key: cylinder_1_T_K
      label: cylinder
      axis_id: ax_p
      color: '#b42318'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
    - signal_key: compressor_1_T_K
      label: bounce
      axis_id: ax_p
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
    - signal_key: receiver_1_T_K
      label: receiver
      axis_id: ax_p
      color: '#027a48'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
    - signal_key: exhaust_plenum_1_T_K
      label: exhaust_plenum
      axis_id: ax_p
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
    - signal_key: ambient_in_T_K
      label: ambient_in
      axis_id: ax_p
      color: '#f79009'
      line_style: --
      scale_factor: 1
      unit_preset: raw
    - signal_key: ambient_out_T_K
      label: ambient_out
      axis_id: ax_p
      color: '#667085'
      line_style: --
      scale_factor: 1
      unit_preset: raw
style:
  preset_name: Light Engineering
  font_family: DejaVu Sans
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  subplot_title_visible: true
  figure_title_visible: false
  grid_visible: true
  grid_alpha: 0.3
  legend_visible: true
  legend_position: best
  tight_layout: true
  default_line_width: 0.8
  default_marker_size: 3.5

