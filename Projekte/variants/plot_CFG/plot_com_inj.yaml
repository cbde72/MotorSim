name: Combustion and Injection
style:
  preset_name: Light Engineering
  font_family: DejaVu Sans
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 7
  subplot_title_visible: true
  figure_title_visible: false
  grid_visible: true
  grid_alpha: 0.3
  legend_visible: true
  legend_position: best
  tight_layout: true
  default_line_width: 0.9
  default_marker_size: 3.5
figures:
- title: Einspritzung und Verbrennung
  rows: 2
  cols: 1
  subplots:
  - title: Kraftstoffdosierung und Verbrauch
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mass
      title: Kraftstoffmasse [mg]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: ax_rate
      title: Rate [g/s]
      side: right
      color: '#667085'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_combustion_fuel_mass_latched_kg
      label: cyl1 fuel latched
      axis_id: ax_mass
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_2_combustion_fuel_mass_latched_kg
      label: cyl2 fuel latched
      axis_id: ax_mass
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_fuel_vapor_kg
      label: cyl1 fuel vapor
      axis_id: ax_mass
      color: '#12b76a'
      line_style: '--'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_2_m_fuel_vapor_kg
      label: cyl2 fuel vapor
      axis_id: ax_mass
      color: '#0e9384'
      line_style: '--'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_combustion_fuel_burn_rate_kg_per_s
      label: cyl1 fuel burn
      axis_id: ax_rate
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: cylinder_2_combustion_fuel_burn_rate_kg_per_s
      label: cyl2 fuel burn
      axis_id: ax_rate
      color: '#f79009'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: cylinder_1_injector_rate_kg_per_s
      label: cyl1 injector
      axis_id: ax_rate
      color: '#344054'
      line_style: ':'
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: cylinder_2_injector_rate_kg_per_s
      label: cyl2 injector
      axis_id: ax_rate
      color: '#98a2b3'
      line_style: ':'
      scale_factor: 1000.0
      unit_preset: raw

  - title: Waermefreisetzung und Lambda
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_power
      title: Leistung [kW]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: ax_lambda
      title: Lambda / aktiv [-]
      side: right
      color: '#667085'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_added_energy_W
      label: cyl1 qdot vibe
      axis_id: ax_power
      color: '#b42318'
      line_style: '-'
      scale_factor: 0.001
      unit_preset: raw
    - signal_key: cylinder_2_added_energy_W
      label: cyl2 qdot vibe
      axis_id: ax_power
      color: '#f79009'
      line_style: '-'
      scale_factor: 0.001
      unit_preset: raw
    - signal_key: cylinder_1_combustion_qdot_effective_W
      label: cyl1 qdot effective
      axis_id: ax_power
      color: '#d92d20'
      line_style: '--'
      scale_factor: 0.001
      unit_preset: raw
    - signal_key: cylinder_2_combustion_qdot_effective_W
      label: cyl2 qdot effective
      axis_id: ax_power
      color: '#dc6803'
      line_style: '--'
      scale_factor: 0.001
      unit_preset: raw
    - signal_key: cylinder_1_lambda
      label: cyl1 lambda latch
      axis_id: ax_lambda
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_2_lambda
      label: cyl2 lambda latch
      axis_id: ax_lambda
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_thermo_lambda
      label: cyl1 lambda thermo
      axis_id: ax_lambda
      color: '#12b76a'
      line_style: '--'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_2_thermo_lambda
      label: cyl2 lambda thermo
      axis_id: ax_lambda
      color: '#0e9384'
      line_style: '--'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_combustion_active_0to1
      label: cyl1 combustion active
      axis_id: ax_lambda
      color: '#344054'
      line_style: ':'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_2_combustion_active_0to1
      label: cyl2 combustion active
      axis_id: ax_lambda
      color: '#98a2b3'
      line_style: ':'
      scale_factor: 1.0
      unit_preset: raw
