name: Free-Piston Combined All Mass Plots
style:
  preset_name: Light Engineering
  font_family: DejaVu Sans
  font_size: 6
  axis_label_size: 6
  tick_label_size: 6
  title_size: 6
  figure_title_size: 6
  subplot_title_visible: true
  figure_title_visible: false
  grid_visible: true
  grid_alpha: 0.3
  legend_visible: true
  legend_position: best
  tight_layout: true
  default_line_width: 0.8
  default_marker_size: 3.5
figures:
- id: d7b6b4a2a355
  title: Free-Piston Massen aller vorhandenen Volumes
  rows: 1
  cols: 1
  subplots:
