    title: Massen über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_scale_factor: 1.0
    x_offset: 0.0
    x_limit_mode: auto
    x_min: 0.0
    x_max: 720.0
    y_axes:
    - id: ax_m
      title: Masse [mg]
      side: left
      spine_offset: 0.0
      color: '#111111'
      visible: true
      limit_mode: data
      y_min: 0.0
      y_max: 1.0
      tick_step: 0.0
      minor_tick_step: 0.0
      major_grid: true
      minor_grid: false
    series:
    - id: df11c9d16f18
      signal_key: cylinder_m_kg
      label: cylinder
      axis_id: ax_m
      visible: true
      color: '#b42318'
      line_style: '-'
      marker: ''
      line_width: 1.8
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1000000.0
      offset: 0.0
      series_type: line
    - id: 5fa4eafe9259
