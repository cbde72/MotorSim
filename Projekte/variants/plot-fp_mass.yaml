      label: receiver
      axis_id: ax_m
      visible: true
      color: '#027a48'
      line_style: '-'
      marker: ''
      line_width: 1.8
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1000000.0
      offset: 0.0
      series_type: line
    - id: 3cc2f008a60f
      signal_key: exhaust_plenum_m_kg
      label: exhaust_plenum
