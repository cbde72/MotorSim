      visible: true
      color: '#175cd3'
      line_style: '-'
      marker: ''
      line_width: 1.8
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1000000.0
      offset: 0.0
      series_type: line
    - id: ea73d7e43cb8
