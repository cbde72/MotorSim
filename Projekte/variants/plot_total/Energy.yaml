name: Kolbenweg, Öffnungsquerschnitte, Massenstrom, Zugeführte Energie
style_sheet: ../../plot_style_sheet.yaml
style:
figures:
- title: energy
  rows: 1
  cols: 1
  subplots:
  - title: Kolbenweg, Öffnungsquerschnitte, Massenstrom, Zugeführte Energie
    show_title: false
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    x_start_at_zero: true
    x_spans:
    - signal_key: cylinder_1_added_energy_W
      threshold: 1.0
      active_when: above
      color: '#FF0000'
      alpha: 0.12
      label: Verbrennung
      show_label: false
    - signal_key: free_piston_generator_power_W
      threshold: 1.0
      active_when: above
      color: '#97FFFF'
      alpha: 0.52
      label: Load
      show_label: false
    y_axes:
    - id: ax_x
      title: Kolbenweg [mm] (+54 = OT, -54 = UT)
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -60.0
      y_max: 60.0
      min: -60.0
      max: 60.0
    - id: ax_mdot
      title: Massenstrom [kg/s]
      side: right
      color: '#111111'
      limit_mode: manual
      y_min: -0.5
      y_max: 0.5
      min: -0.5
      max: 0.5
    - id: ax_qzu
      title: Qzu [W]
      side: right
      color: '#FF0000'
      limit_mode: manual
      y_min: 0.0
      y_max: 350000.0
      min: 0.0
      max: 350000.0
    y_lines:
    - y: -54.0
      axis_id: ax_x
      label: UT
      show_label: true
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.95
    - y: 54.0
      axis_id: ax_x
      label: OT
      show_label: true
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.95
    - y: -38.0
      axis_id: ax_x
      label: Intake
      show_label: true
      label_position: above
      label_offset_pt: 1
      color: '#0000FF'
      line_style: dotted
      line_width: 0.5
      alpha: 0.9
    - y: -36.0
      axis_id: ax_x
      label: Exhaust
      show_label: true
      label_position: below
      label_offset_pt: 2
      color: '#FF0000'
      line_style: dotted
      line_width: 0.5
      alpha: 0.9
    series:
    - signal_key: free_piston_x_m
      label: Kolbenweg
      axis_id: ax_x
      color: '#111111'
      line_style: '-'
      line_width: 1.0
      scale_factor: -1000.0
      unit_preset: raw
      offset: 54.04
    - signal_key: transfer_slot_1_mdot_kg_per_s
      label: Einströmender Massenstrom
      axis_id: ax_mdot
      color: '#12b76a'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: exhaust_slot_1_mdot_kg_per_s
      label: Ausströmender Massenstrom
      axis_id: ax_mdot
      color: '#f79009'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_added_energy_W
      label: Zugeführte Energie
      axis_id: ax_qzu
      color: '#FF0000'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1.0
      unit_preset: raw
