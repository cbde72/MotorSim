name: Heat release and lambda
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.0
figures:
- id: c5343d6934ed
  title: Injection and combustion
  rows: 1
  cols: 1
  subplots:
  - id: 10babe302236
    title: Heat release and lambda
    show_title: true
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_scale_factor: 1.0
    x_offset: 0.0
    x_limit_mode: auto
    x_min: 0.0
    x_max: 720.0
    x_start_at_zero: true
    y_axes:
    - id: ax_power
      title: Power [kW]
      side: left
      spine_offset: 0.0
      color: '#111111'
      visible: true
      limit_mode: data
      y_min: 0.0
      y_max: 1.0
      tick_step: 0.0
      minor_tick_step: 0.0
      major_grid: true
      minor_grid: false
    - id: ax_lambda
      title: Lambda / aktiv [-]
      side: right
      spine_offset: 0.0
      color: '#111111'
      visible: true
      limit_mode: data
      y_min: 0.0
      y_max: 1.0
      tick_step: 0.0
      minor_tick_step: 0.0
      major_grid: true
      minor_grid: false
    series:
    - id: 7b1049cd2b9f
      signal_key: cylinder_1_added_energy_W
      label: cyl1 qdot vibe
      axis_id: ax_power
      visible: true
      color: '#FF0000'
      line_style: '-'
      marker: ''
      line_width: 1.9
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 0.001
      offset: 0.0
      series_type: line
    - id: 16a0337283dc
      signal_key: cylinder_2_added_energy_W
      label: cyl2 qdot vibe
      axis_id: ax_power
      visible: true
      color: '#FF8C00'
      line_style: '-'
      marker: ''
      line_width: 1.0
      marker_size: 1.5
      unit_preset: raw
      scale_factor: 0.001
      offset: 0.0
      series_type: line
    - id: 46c7ec14c878
      signal_key: cylinder_1_combustion_active_0to1
      label: cyl1 combustion active
      axis_id: ax_lambda
      visible: true
      color: '#7DD3C7'
      line_style: '-'
      marker: ''
      line_width: 1.0
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1.0
      offset: 0.0
      series_type: line
    - id: dedca3098718
      signal_key: cylinder_2_combustion_active_0to1
      label: cyl2 combustion active
      axis_id: ax_lambda
      visible: true
      color: '#087A6A'
      line_style: '-'
      marker: ''
      line_width: 1.0
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1.0
      offset: 0.0
      series_type: line
    events: []
    y_lines: []
    legend_visible: true
    legend_position: upper left
    show_grid: true
