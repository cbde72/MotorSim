name: Kolbengeschwindigkeit über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
figures:
- title: Kolbengeschwindigkeit
  rows: 1
  cols: 1
  subplots:
  - title: Kolbengeschwindigkeit über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_vp
      title: Geschwindigkeit [m/s]
      side: left
      color: '#111111'
      limit_mode: data
    y_lines:
    - y: 0.0
      label: v = 0
      axis_id: ax_vp
      color: '#667085'
      line_style: --
      line_width: 0.6
      alpha: 0.8
      show_label: true
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#667085'
    series:
    - signal_key: cylinder_1_piston_v_m_per_s
      label: Arbeitszylinder 1
      axis_id: ax_vp
      color: '#000000'
      line_style: '-'
      line_width: 1.6
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_2_piston_v_m_per_s
      label: Arbeitszylinder 2
      axis_id: ax_vp
      color: '#000000'
      line_style: --
      line_width: 1.6
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: compressor_1_piston_v_m_per_s
      label: Compressor 1
      axis_id: ax_vp
      color: '#0067c5'
      line_style: '-'
      line_width: 1.6
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: compressor_2_piston_v_m_per_s
      label: Compressor 2
      axis_id: ax_vp
      color: '#0067c5'
      line_style: --
      line_width: 1.6
      scale_factor: 1.0
      unit_preset: raw
