name: Zylinder Massen über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
figures:
- title: Zylinder Massen über Zeit
  rows: 1
  cols: 1
  subplots:
  - title: Zylinder Massen über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_m_cyl
      title: Masse [mg]
      side: left
      color: '#111111'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_m_kg
      label: Gas gesamt
      axis_id: ax_m_cyl
      color: '#111111'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_air_kg
      label: Luft
      axis_id: ax_m_cyl
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_fuel_vapor_kg
      label: Kraftstoff gasförmig
      axis_id: ax_m_cyl
      color: '#f79009'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_fuel_liquid_kg
      label: Kraftstoff flüssig
      axis_id: ax_m_cyl
      color: '#12b76a'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_fuel_total_kg
      label: Kraftstoff gesamt
      axis_id: ax_m_cyl
      color: '#7a5af8'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_burned_kg
      label: Verbrannt
      axis_id: ax_m_cyl
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
