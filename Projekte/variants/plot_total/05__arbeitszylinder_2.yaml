name: Power cylinder 2
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: pV
  rows: 1
  cols: 1
  subplots:
  - title: Power cylinder 2
    plot_type: line
    x_signal: cylinder_2_V_m3
    x_title: Volume [cm³]
    x_scale_factor: 1000000.0
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p_2
      title: Pressure [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_2_p_Pa
      label: Power cylinder 2
      axis_id: ax_p_2
      color: '#0050A4'
      line_style: '-'
      line_width: 1.8
      scale_factor: 1.0e-05
      unit_preset: raw
    show_title: true
