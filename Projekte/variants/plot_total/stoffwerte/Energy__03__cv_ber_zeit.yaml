name: cv über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
figures:
- title: cv_t
  rows: 1
  cols: 1
  subplots:
  - title: cv über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    y_axes:
    - id: ax_cv
      title: cv [J/(kg K)]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_cv_J_per_kgK
      label: Zylinder cv
      axis_id: ax_cv
      color: '#b42318'
      line_style: '-'
    - signal_key: compressor_1_cv_J_per_kgK
      label: Bounce cv
      axis_id: ax_cv
      color: '#175cd3'
      line_style: --
