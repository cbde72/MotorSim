name: cp über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
figures:
- title: cp_t
  rows: 1
  cols: 1
  subplots:
  - title: cp über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    y_axes:
    - id: ax_cp
      title: cp [J/(kg K)]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_cp_J_per_kgK
      label: Zylinder cp
      axis_id: ax_cp
      color: '#b42318'
      line_style: '-'
    - signal_key: compressor_1_cp_J_per_kgK
      label: Bounce cp
      axis_id: ax_cp
      color: '#175cd3'
      line_style: --
