name: cv over time
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: cv_t
  rows: 1
  cols: 1
  subplots:
  - title: cv over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    y_axes:
    - id: ax_cv
      title: cv [J/(kg K)]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_cv_J_per_kgK
      label: Cylinder cv
      axis_id: ax_cv
      color: '#7DD3C7'
      line_style: '-'
      line_width: 1.6
    - signal_key: compressor_1_cv_J_per_kgK
      label: Bounce cv
      axis_id: ax_cv
      color: '#667085'
      line_style: '-'
      line_width: 1.6
    show_title: true
