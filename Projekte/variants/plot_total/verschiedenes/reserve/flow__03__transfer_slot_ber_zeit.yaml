name: Transfer-Slot over time
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: Transfer-Slot Mass flow-Komponenten
  rows: 1
  cols: 1
  subplots:
  - title: Transfer-Slot over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mdot
      title: Mass flow [mg/s]
      side: left
      color: '#111111'
      limit_mode: auto
      y_min: -1.0
      y_max: 11.0
    series:
    - signal_key: transfer_slot_1_mdot_kg_per_s
      label: transfer_slot total
      axis_id: ax_mdot
      color: '#175CD3'
      line_style: -.
      scale_factor: 1000000
      unit_preset: raw
      line_width: 1.45
    - signal_key: transfer_slot_1_mdot_unburned_kg_per_s
      label: transfer_slot unburned
      axis_id: ax_mdot
      color: '#175CD3'
      line_style: -.
      scale_factor: 1000000
      unit_preset: raw
      line_width: 1.45
    - signal_key: transfer_slot_1_mdot_burned_kg_per_s
      label: transfer_slot burned
      axis_id: ax_mdot
      color: '#175CD3'
      line_style: -.
      scale_factor: 1000000
      unit_preset: raw
      line_width: 1.45
    show_title: true
