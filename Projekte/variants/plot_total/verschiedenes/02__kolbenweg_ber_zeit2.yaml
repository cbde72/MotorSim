name: stroke vs time
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: s_t
  rows: 1
  cols: 1
  subplots:
  - title: stroke vs time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_x
      limit_mode: manual
      y_min: -100.0
      y_max: 100.0
      title: stroke [mm] (+91.1 = OT, 0 = UT)
      side: left
      color: '#111111'
      min: -100.0
      max: 100.0
    #y_lines:
    #- y: 0
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      axis_id: ax_x
      show_label: true
      label: UT
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.95
    #- y: 91.1
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
      axis_id: ax_x
      show_label: true
      label: OT
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.95
    #- y: -70.86
      label_position: above
      label_offset_pt: 1
      axis_id: ax_x
      show_label: true
      label: Intake
      color: '#0000FF'
      line_style: dotted
      label_font_size: 4
      line_width: 0.5
      alpha: 0.9
    - y: -55.68
      label_position: below
      label_offset_pt: 2
      axis_id: ax_x
      show_label: true
      label: Exhaust
      label_font_size: 4
      color: '#FF0000'
      line_style: dotted
      line_width: 0.5
      alpha: 0.9
    series:
    - signal_key: free_piston_x_m
      label: position
      axis_id: ax_x
      color: '#111111'
      line_style: --
      scale_factor: -1000.0
      unit_preset: raw
      #offset: 0
      line_width: 1.0
    show_title: true
