name: Pressure
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: p_t
  rows: 1
  cols: 1
  subplots:
  - title: Pressure
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p
      title: Pressure [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_p_Pa
      label: Combustion Chamber 1
      axis_id: ax_p
      color: '#66B3FF'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.8
    - signal_key: compressor_1_p_Pa
      label: Compression Chamber 1
      axis_id: ax_p
      color: '#667085'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.8
    - signal_key: receiver_1_p_Pa
      label: Transfer
      axis_id: ax_p
      color: '#175CD3'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.8
    show_title: true
