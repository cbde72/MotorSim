name: Pressure
style_sheet: ../../plot_style_sheet.yaml
style:
figures:
- title: p_t
  rows: 1
  cols: 1
  subplots:
  - title: Pressure
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p
      title: Druck [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_1_p_Pa
      label: Zylinder
      axis_id: ax_p
      color: '#b42318'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
    - signal_key: compressor_1_p_Pa
      label: Bounce
      axis_id: ax_p
      color: '#111111'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
    - signal_key: receiver_1_p_Pa
      label: Transfer
      axis_id: ax_p
      color: '#0000FF'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
