      limit_mode: data
      y_min: 0.0
      y_max: 1.0
      tick_step: 0.0
      minor_tick_step: 0.0
      major_grid: true
      minor_grid: false
    - id: ax_lambda
      title: Lambda / aktiv [-]
      side: right
      spine_offset: 0.0
      color: '#667085'
      visible: true
      limit_mode: data
      y_min: 0.0
      y_max: 1.0
      tick_step: 0.0
      minor_tick_step: 0.0
      major_grid: true
      minor_grid: false
    series:
    - id: 7b1049cd2b9f
      signal_key: cylinder_1_added_energy_W
      label: cyl1 qdot vibe
      axis_id: ax_power
      visible: true
      color: '#b42318'
      line_style: '-'
      marker: ''
      line_width: 1.8
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 0.001
      offset: 0.0
      series_type: line
    - id: 16a0337283dc
      signal_key: cylinder_2_added_energy_W
      label: cyl2 qdot vibe
