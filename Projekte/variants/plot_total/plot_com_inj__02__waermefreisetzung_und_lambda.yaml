      visible: true
      color: '#f79009'
      line_style: '-'
      marker: ''
      line_width: 1.8
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 0.001
      offset: 0.0
      series_type: line
    - id: 46c7ec14c878
