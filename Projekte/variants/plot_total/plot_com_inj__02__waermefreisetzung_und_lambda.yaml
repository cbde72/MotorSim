name: Waermefreisetzung und Lambda
style_sheet: ../../plot_style_sheet.yaml
style:
  background_color: '#ffffff'
  axes_facecolor: '#ffffff'
  text_color: '#202020'
  grid_color: '#d9d9d9'
  legend_facecolor: '#ffffff'
  legend_edgecolor: '#a0a0a0'
figures:
- id: c5343d6934ed
  title: Einspritzung und Verbrennung
  rows: 1
  cols: 1
  subplots:
  - id: 10babe302236
