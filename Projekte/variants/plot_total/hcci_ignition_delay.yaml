name: HCCI Zuendverzug - letzter UT-OT-UT-Zyklus
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.8
figures:
- title: last_ut_ot_ut_hcci_ignition_delay
  rows: 1
  cols: 1
  subplots:
  - title: HCCI Zuendverzug - letzter UT-OT-UT-Zyklus
    plot_type: line
    x_signal: theta_deg
    x_title: UT-OT-UT Fortschritt [deg]
    x_limit_mode: manual
    x_min: -9.0
    x_max: 9.0
    events:
    - x: -9.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: left
    - x: 0.0
      label: OT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: center
    - x: 9.0
      label: UT
      color: '#666666'
      line_style: ':'
      line_width: 0.9
      label_ha: right
    text_box:
      enabled: true
      source: readme
      title: HCCI Kennwerte
      x: 0.02
      y: 0.98
      ha: left
      va: top
      font_size: 7.0
      facecolor: '#ffffff'
      edgecolor: '#111111'
      alpha: 0.94
      metrics:
      - label: Lambda Zyl. 1
        readme_key: cylinder_1_lambda
      - label: Restgas Zyl. 1
        readme_key: cylinder_1_restgas_anteil_brennbeginn_percent
      - label: Lambda Zyl. 2
        readme_key: cylinder_2_lambda
      - label: Restgas Zyl. 2
        readme_key: cylinder_2_restgas_anteil_brennbeginn_percent
    y_axes:
    - id: tau
      title: Zuendverzug [ms]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: integral
      title: Livengood-Wu Integral [-]
      side: right
      color: '#475467'
      limit_mode: auto
    series:
    - signal_key: cylinder_1_hcci_ignition_delay_s
      label: Zyl. 1 Zuendverzug
      axis_id: tau
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000.0
    - signal_key: cylinder_2_hcci_ignition_delay_s
      label: Zyl. 2 Zuendverzug
      axis_id: tau
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000.0
    - signal_key: cylinder_1_hcci_ignition_integral
      label: Zyl. 1 Integral
      axis_id: integral
      color: '#f79009'
      line_style: --
    - signal_key: cylinder_2_hcci_ignition_integral
      label: Zyl. 2 Integral
      axis_id: integral
      color: '#027a48'
      line_style: --
