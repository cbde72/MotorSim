name: Free-Piston Einzelplots
figures:
- title: Free-Piston Temperaturverläufe aller Volumes
  rows: 1
  cols: 1
  subplots:
  - title: Temperaturen über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p
      title: Temperature [K]
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: .0
      y_max: 3000.0
    series:
    - signal_key: cylinder_1_T_K
      label: cylinder
      axis_id: ax_p
      color: '#b42318'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
    - signal_key: compressor_1_T_K
      label: bounce
      axis_id: ax_p
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
    - signal_key: receiver_1_T_K
      label: receiver
      axis_id: ax_p
      color: '#027a48'
      line_style: '-'
      scale_factor: 1
      unit_preset: raw
    - signal_key: exhaust_plenum_1_T_K
      label: ambient_out
      axis_id: ax_p
      color: '#667085'
      line_style: --
      scale_factor: 1
      unit_preset: raw
style:
style_sheet: ../../plot_style_sheet.yaml
