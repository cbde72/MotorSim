      marker: ''
      line_width: 1.0
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1000000.0
      offset: 0.0
      series_type: line
    - id: 3cc2f008a60f
      signal_key: exhaust_plenum_1_m_kg
      label: exhaust_plenum
      axis_id: ax_m
      visible: true
      color: '#667085'
      line_style: '-'
      marker: ''
      line_width: 1.0
      marker_size: 4.5
      unit_preset: raw
      scale_factor: 1000000.0
      offset: 0.0
      series_type: line
    events: []
    legend_visible: true
    legend_position: upper right
    show_grid: true
    show_title: true
