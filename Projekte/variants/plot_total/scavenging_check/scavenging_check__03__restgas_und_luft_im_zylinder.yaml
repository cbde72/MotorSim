name: Restgas und Luft im Zylinder
style_sheet: ../../plot_style_sheet.yaml
style:
figures:
- title: Spuelung - Zusammensetzung im Zylinder
  rows: 1
  cols: 1
  subplots:
  - title: Restgas und Luft im Zylinder
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mass
      title: Masse [mg]
      side: left
      color: '#111111'
      limit_mode: auto
    - id: ax_frac
      title: Anteil [-]
      side: right
      color: '#667085'
      limit_mode: manual
      y_min: -0.05
      y_max: 1.05
    series:
    - signal_key: cylinder_1_m_air_kg
      label: m_air
      axis_id: ax_mass
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_m_burned_kg
      label: m_burned
      axis_id: ax_mass
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: cylinder_1_share_air_0to1
      label: share_air
      axis_id: ax_frac
      color: '#12b76a'
      line_style: --
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_1_share_burned_0to1
      label: share_burned
      axis_id: ax_frac
      color: '#7a5af8'
      line_style: --
      scale_factor: 1.0
      unit_preset: raw
