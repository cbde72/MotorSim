name: Pressures over time
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.0
figures:
- title: Free-piston pressure traces of all volumes
  rows: 1
  cols: 1
  subplots:
  - title: Pressures over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p
      title: Pressure [bar]
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -1.0
      y_max: 11.0
    series:
    - signal_key: cylinder_1_p_Pa
      label: cylinder
      axis_id: ax_p
      color: '#66B3FF'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.0
    - signal_key: compressor_1_p_Pa
      label: bounce
      axis_id: ax_p
      color: '#667085'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.0
    - signal_key: receiver_1_p_Pa
      label: receiver
      axis_id: ax_p
      color: '#175CD3'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.0
    - signal_key: exhaust_plenum_1_p_Pa
      label: exhaust_plenum
      axis_id: ax_p
      color: '#D92D20'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.0
    - signal_key: ambient_in_p_Pa
      label: ambient_in
      axis_id: ax_p
      color: '#175CD3'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.0
    - signal_key: ambient_out_p_Pa
      label: ambient_out
      axis_id: ax_p
      color: '#D92D20'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.0
    show_title: true
