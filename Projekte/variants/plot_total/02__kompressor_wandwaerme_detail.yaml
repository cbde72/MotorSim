name: V40 compressor wall-heat detail verification
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.0
figures:
- title: V40_Compressor_Wall heat_Detail
  rows: 2
  cols: 2
  subplots:
  - title: Cumulative compressor wall heat energy
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_start_at_zero: true
    y_axes:
    - id: energy
      title: Wall heat-absolute integral [J]
      side: left
      limit_mode: auto
      color: '#111111'
    series:
    - signal_key: compressor_1_wall_heat_cycle_J
      label: Compressor 1
      axis_id: energy
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    - signal_key: compressor_2_wall_heat_cycle_J
      label: Compressor 2
      axis_id: energy
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    show_title: true
  - title: Compressor wall heat power
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_start_at_zero: true
    y_axes:
    - id: power
      title: Wall heat rate [W]
      side: left
      limit_mode: auto
      color: '#111111'
    series:
    - signal_key: compressor_1_wall_heat_W
      label: Compressor 1
      axis_id: power
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    - signal_key: compressor_2_wall_heat_W
      label: Compressor 2
      axis_id: power
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    show_title: true
  - title: Compressor heat transfer coefficient
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_start_at_zero: true
    y_axes:
    - id: htc
      title: HTC [W/(m2 K)]
      side: left
      limit_mode: auto
      color: '#111111'
    series:
    - signal_key: compressor_1_htc_W_per_m2K
      label: Compressor 1
      axis_id: htc
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    - signal_key: compressor_2_htc_W_per_m2K
      label: Compressor 2
      axis_id: htc
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    show_title: true
  - title: Compressor gas and wall temperatures
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_start_at_zero: true
    y_axes:
    - id: temperature
      title: Temperature [K]
      side: left
      limit_mode: auto
      color: '#111111'
    series:
    - signal_key: compressor_1_T_K
      label: Gas Compressor 1
      axis_id: temperature
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    - signal_key: compressor_2_T_K
      label: Gas Compressor 2
      axis_id: temperature
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    - signal_key: compressor_1_wall_temperature_K
      label: Wall Compressor 1
      axis_id: temperature
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    - signal_key: compressor_2_wall_temperature_K
      label: Wall Compressor 2
      axis_id: temperature
      color: '#667085'
      line_style: '-'
      line_width: 1.0
    show_title: true
