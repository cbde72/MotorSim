name: Arbeitszylinder 2
style_sheet: ../../plot_style_sheet.yaml
style:
figures:
- title: energy
  rows: 1
  cols: 1
  subplots:
  - title: Arbeitszylinder 2
    show_title: true
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    x_start_at_zero: true
    y_axes:
    - id: ax_x_2
      title: Kolbenweg [mm] (+54.035 = OT, -54.035 = UT)
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -60.0
      y_max: 60.0
      min: -60.0
      max: 60.0
    - id: ax_a_open_2
      title: Öffnungsquerschnitt [mm²]
      side: right
      color: '#175cd3'
    - id: ax_mdot_2
      title: Massenstrom [kg/s]
      side: right
      color: '#111111'
    - id: ax_qzu_2
      title: Qzu [W]
      side: right
      color: '#027a48'
      limit_mode: manual
      y_min: 0.0
      y_max: 1000000.0
      min: 0.0
      max: 1000000.0
    series:
    - signal_key: cylinder_2_piston_distance_from_tdc_m
      label: Kolbenweg
      axis_id: ax_x_2
      color: '#111111'
      line_style: '-'
      line_width: 1.0
      scale_factor: -1000.0
      unit_preset: raw
      offset: 54.035
    - signal_key: transfer_slot_2_A_geom_m2
      label: Transfer Öffnungsquerschnitt
      axis_id: ax_a_open_2
      color: '#175cd3'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: exhaust_slot_2_A_geom_m2
      label: Auslass Öffnungsquerschnitt
      axis_id: ax_a_open_2
      color: '#b42318'
      line_style: --
      line_width: 0.8
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: transfer_slot_2_mdot_kg_per_s
      label: Einströmender Massenstrom
      axis_id: ax_mdot_2
      color: '#12b76a'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: exhaust_slot_2_mdot_kg_per_s
      label: Ausströmender Massenstrom
      axis_id: ax_mdot_2
      color: '#f79009'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_2_added_energy_W
      label: Zugeführte Energie
      axis_id: ax_qzu_2
      color: '#FF0000'
      line_style: '-'
      line_width: 0.8
      scale_factor: 1.0
      unit_preset: raw
