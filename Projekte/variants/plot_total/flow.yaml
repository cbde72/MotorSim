name: Exhaust-Slot über Zeit
style_sheet: ../../plot_style_sheet.yaml
style:
figures:
- title: Exhaust-Slot Massenstrom-Komponenten
  rows: 1
  cols: 1
  subplots:
  - title: Exhaust-Slot über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_mdot
      title: Massenstrom [mg/s]
      side: left
      color: '#111111'
      limit_mode: auto
      y_min: -1.0
      y_max: 11.0
    series:
    - signal_key: exhaust_slot_1_mdot_kg_per_s
      label: exhaust_slot total
      axis_id: ax_mdot
      color: '#111111'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
    - signal_key: exhaust_slot_1_mdot_unburned_kg_per_s
      label: exhaust_slot unburned
      axis_id: ax_mdot
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
    - signal_key: exhaust_slot_1_mdot_burned_kg_per_s
      label: exhaust_slot burned
      axis_id: ax_mdot
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000
      unit_preset: raw
