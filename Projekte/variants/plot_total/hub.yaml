name: Piston position over time
style_sheet: ../../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- title: Piston position
  rows: 1
  cols: 1
  subplots:
  - title: Piston position over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_x
      title: Piston position [mm] (+46 = OT, -46 = UT)
      side: left
      color: '#111111'
      limit_mode: manual
      y_min: -50.0
      y_max: 50.0
    y_lines:
    - y: 45.553093
      label: OT
      axis_id: ax_x
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.9
      show_label: true
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
    - y: -45.553093
      label: UT
      axis_id: ax_x
      color: '#000000'
      line_style: --
      line_width: 0.5
      alpha: 0.9
      show_label: true
      label_position: center
      label_bg_color: '#FFFFFF'
      label_border_color: '#000000'
    series:
    - signal_key: cylinder_1_piston_x_m
      label: Position cylinder 1
      axis_id: ax_x
      color: '#111111'
      line_style: --
      line_width: 1.35
      scale_factor: -1000.0
      offset: 45.553093
      unit_preset: raw
    - signal_key: cylinder_2_piston_x_m
      label: Position cylinder 2
      axis_id: ax_x
      color: '#FF0000'
      line_style: --
      line_width: 1.35
      scale_factor: -1000.0
      offset: 45.553093
      unit_preset: raw
    - signal_key: compressor_1_piston_x_m
      label: Position Compressor 1
      axis_id: ax_x
      color: '#B0C4DE'
      line_style: --
      line_width: 1.35
      scale_factor: -1000.0
      offset: 45.553093
      unit_preset: raw
    - signal_key: compressor_2_piston_x_m
      label: Compressor 2
      axis_id: ax_x
      color: '#7B68EE'
      line_style: --
      line_width: 1.35
      scale_factor: -1000.0
      offset: 45.553093
      unit_preset: raw
    show_title: true
