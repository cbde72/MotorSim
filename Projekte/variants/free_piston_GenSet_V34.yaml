          initial_temperature_K: 550.0
          coolant_temperature_K: 350.0
          lambda_W_per_mK: 160.0
          wall_thickness_m: 0.01
          area_m2: 0.002875
        piston:
          initial_temperature_K: 580.0
          coolant_temperature_K: 350.0
          lambda_W_per_mK: 160.0
          wall_thickness_m: 0.012
          area_m2: 0.002875
    wall_heat:
      woschni_promo_wall:
        model: woschni
        variant: promo
        wall_temperature_K: 450.0
        wall_area_m2: 0.03
        dp_mode: 'off'
        multiplier: 15
        reference_state_mode: none
        phase_mode: promo
        c1: 2.28
        c2: 0.00324
        c3: 0.0
        cucm: 0.0
        swirl_number: 0.0
        imep_bar: 0.0
    combustion:
      vibe_lambda_slot:
        model: vibe
        start_mode: hign_position
        duration_mode: time
        hign_mm: 15.0
        duration_ms: 6.0
        a: 6.9
        m: 2.0
        energy_coupling: none
        fueling_mode: lambda_from_cylinder_mass_at_slot_close
        lambda_target: 1.0
        lhv_J_per_kg: 43000000.0
        afr_stoich_kg_air_per_kg_fuel: 14.5
        combustion_efficiency_0to1: 1.0
        slot_open_threshold_m2: 1.0e-07
        slot_closed_threshold_m2: 1.0e-12
        compression_velocity_threshold_m_per_s: 0.02
        angle_reference: absolute
        hcci_diagnostics_ref: ignition_diag_beck_2003_1_arrhenius
    ignition:
      ignition_diag_beck_2003_1_arrhenius:
        model: beck_2003_1_arrhenius
        beck_c1_s: 1.0e-05
        beck_c2: -1.2
        beck_reference_pressure_bar: 1.0
        beck_reference_o2_percent: 20.94
        tau_activation_temperature_K: 5000.0
        tau_reference_pressure_Pa: 1000000.0
        tau_reference_lambda: 1.0
        lambda_slowdown_exponent: 0.7
        residual_slowdown_factor: 1.5
        start_temperature_min_K: 580.0
        start_pressure_min_Pa: 500000.0
        max_ignition_delay_s: 0.002
        accumulation_start_mode: piston_distance_from_tdc
        accumulation_start_distance_from_tdc_mm: 30.0
        accumulation_end_mode: combustion_end
    connections:
      compressor_in_check_valve:
        type: check_valve
        diameter_mm: 55
        discharge_coefficient: 0.82
        cracking_pressure_Pa: 0.0
      compressor_out_check_valve:
        type: check_valve
        diameter_mm: 55.3
        discharge_coefficient: 0.82
        cracking_pressure_Pa: 50000.0
      transfer_slot:
        type: slot
        source_of_data: rectangle
        opening_mode: by_distance
        distance_from_tdc_mm: 92.07
        piston_height_if_crankcase_m: 0.0
        entrance_angle_deg: 0.0
        width_mm: 26.0
        height_mm: 16.0
        open_fillet_radius_m: 0.0
        full_fillet_radius_m: 0.0
        number_of_identical_holes: 6
        discharge_coefficients:
          mode: constant
          forward_cd: 0.95
          reverse_cd: 0.95
      exhaust_slot:
        type: slot
        source_of_data: rectangle
        opening_mode: by_distance
