versioning:
  package_version: 7.1.127
  config_schema_version: 8
  loaded_config_schema_version: 8
  migration_applied: false
test_description: 'Free-piston V33: Vibe combustion with Beck 2003
  1-Arrhenius HCCI ignition diagnostics'
modeling:
  architecture: free_piston
free_piston:
  initial_conditions:
    x0_m: 0.054
    v0_m_per_s: -5.037844182273213
    combustion_state:
      burned_fraction_0to1: 0.0
      released_energy_J: 0.0
      ignition_armed: false
      injection_armed: false
      burned_mass_percent: 0.0
  mechanics:
    kinematics_type: oscillating_rotary
    moving_mass_kg: 11.8
    piston_diameter_m: 0.0605
    compression_ratio: 50
    x_min_m: 0.0
    x_max_m: 0.10807
    angle_min_deg: -9.0
    angle_max_deg: 9.0
    effective_radius_m: 0.34399749399882257
    rotary_inertia_kg_m2: 1.3963444553541455
  friction:
    model: coulomb_viscous
    fc_N: 80.0
    cv_Ns_per_m: 0
  load:
    model: generator_controlled
    damping_Ns_per_m: 0.0
    max_damping_Ns_per_m: 10000
    control_zone_m: 0.01
  scavenging:
    enabled: true
    model: overlap_short_circuit_0d
    scavenging_factor: 1.25
    max_trapping_efficiency: 0.92
    short_circuit_start_ratio: 0.7
    short_circuit_slope: 0.35
    max_short_circuit_fraction: 0.35
    min_residual_fraction: 0.03
preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0
    thermo_model: promo
  features:
    mass_flow: true
    wall_heat: true
    combustion: true
    evaporation: false
    pv_work: true
  engine:
    cycle_type: 2t
    speed_rpm: 25.0
  submodels:
    volumes:
      cylinder_free_piston:
        type: cylinder
        kinematics:
          type: crank_slider
          bore_m: 1.0745
          stroke_m: 1.08
          conrod_m: 1.12
          compression_ratio: 50.0
          phase_deg: 0.0
        wall_temperature:
          ref: cycle_average_wall
        wall_heat:
          ref: woschni_promo_wall
        combustion:
          ref: vibe_lambda_slot
        evaporation:
          model: none
      compressor_bounce:
        type: bounce_chamber
        model: gas_exchange
        initial_burned_fraction_0to1: 0.0
        chamber_diameter_m: 0.07
        chamber_length_m: 0.10807
        compression_ratio: 16
        polytropic_exponent: 1.3
