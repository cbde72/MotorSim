        combustion:
          model: none
        evaporation:
          model: none
      ambient_environment:
        type: environment
        pressure_Pa: 101325.0
        temperature_K: 300.0
    wall_temperature:
      cycle_average_wall:
        model: cycle_average
        relaxation: 0.3
        cylinder:
          initial_temperature_K: 500.0
          coolant_temperature_K: 350.0
          lambda_W_per_mK: 50.0
          wall_thickness_m: 0.006
          area_m2: 0.020541
