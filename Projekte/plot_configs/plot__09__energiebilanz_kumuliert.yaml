versioning:
  package_version: 7.1.99
  config_schema_version: 5
  loaded_config_schema_version: 0
  migration_applied: true
name: energybilanz cumulative
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Standard Thermo0D Plotpaket
  rows: 1
  cols: 1
  subplots:
  - title: energybilanz cumulative
    plot_type: line
    x_signal: cylinder_theta_deg
    x_title: Crank angle [deg]
    x_unit_preset: raw
    events:
    - x: 0.0
      label: OT
      color: '#667085'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 160.0
      label: EVO
      color: '#b42318'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 180.0
      label: UT
      color: '#667085'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 300.0
      label: EVC
      color: '#b42318'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 350.0
      label: SOC
      color: '#f79009'
      line_style: --
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 360.0
      label: OT
      color: '#98a2b3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 370.0
      label: IVO
      color: '#175cd3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 405.0
      label: EOC
      color: '#f79009'
      line_style: --
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 510.0
      label: IVC
      color: '#175cd3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 540.0
      label: UT
      color: '#98a2b3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    y_axes:
    - id: ax_energy
      title: Energy [J]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_delta_U_cycle_J
      label: ΔU since cycle start
      axis_id: ax_energy
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_added_energy_cycle_J
      label: Q_add cumulative
      axis_id: ax_energy
      color: '#C2185B'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.9
    - signal_key: cylinder_wall_heat_cycle_J
      label: Q_wall cumulative
      axis_id: ax_energy
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_enthalpy_net_cycle_J
      label: H_net cumulative
      axis_id: ax_energy
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_piston_work_cycle_J
      label: W_pV cumulative
      axis_id: ax_energy
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_energy_balance_residual_J
      label: Balance error
      axis_id: ax_energy
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    x_limit_mode: manual
    x_min: 0.0
    x_max: 720.0
    show_title: true
style:
  default_line_width: 1.6
