name: Forces over time
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Forces over time
  rows: 1
  cols: 1
  subplots:
  - title: Forces over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_f
      title: Force [N]
      side: left
      color: '#111111'
    series:
    - signal_key: free_piston_F_gas_N
      label: Gas force
      axis_id: ax_f
      color: '#667085'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: free_piston_F_bounce_N
      label: Bounce force
      axis_id: ax_f
      color: '#667085'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: free_piston_F_friction_N
      label: Friction force
      axis_id: ax_f
      color: '#667085'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: free_piston_F_load_N
      label: Load force
      axis_id: ax_f
      color: '#667085'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: free_piston_F_net_N
      label: Net force
      axis_id: ax_f
      color: '#667085'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    show_title: true
style:
  default_line_width: 1.6
