name: Kolbenweg über Zeit
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Zeitplots
  rows: 1
  cols: 1
  subplots:
  - title: Kolbenweg über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: manual
    y_axes:
    - id: ax_x
      title: Kolbenweg [mm] (+54 = OT, -54 = UT)
      side: left
      color: '#111111'
    series:
    - signal_key: free_piston_x_m
      label: Kolbenweg
      axis_id: ax_x
      color: '#175cd3'
      line_style: '-'
      scale_factor: -1000.0
      unit_preset: raw
      offset: 54.04
    x_min: 0.0
    x_max: 0.6
