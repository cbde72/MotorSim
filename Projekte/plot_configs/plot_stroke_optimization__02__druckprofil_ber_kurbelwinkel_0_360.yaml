name: Pressureprofil over crank angle (0°-360°)
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Cylinder pressure vs. crank angle
  rows: 1
  cols: 1
  subplots:
  - title: Pressureprofil over crank angle (0°-360°)
    x_signal: cylinder_0_theta_deg
    x_title: Crank angle [deg]
    y_axes:
    - id: pressure
      title: Pressure [bar]
      side: left
      color: '#111111'
    - id: volume
      title: Volume [cm³]
      side: right
      color: '#111111'
    series:
    - signal_key: cylinder_0_p_Pa
      label: Pressure
      axis_id: pressure
      color: '#66B3FF'
      line_style: '-'
      line_width: 1.8
      scale_factor: 1.0e-05
    - signal_key: cylinder_0_V_m3
      label: Volume
      axis_id: volume
      color: '#7DD3C7'
      line_style: --
      line_width: 1.05
      scale_factor: 1.0e6
    events:
    - x: 0.0
      label: UT (Lower Dead Center)
      color: '#2ca02c'
      line_style: ':'
      show_label: true
    - x: 180.0
      label: OT (Top Dead Center)
      color: '#d62728'
      line_style: ':'
      show_label: true
    - x: 360.0
      label: UT (Lower Dead Center)
      color: '#2ca02c'
      line_style: ':'
      show_label: true
    show_title: true
style:
  default_line_width: 1.6
