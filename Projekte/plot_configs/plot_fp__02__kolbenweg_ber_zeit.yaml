name: Piston position over time
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Timeplots
  rows: 1
  cols: 1
  subplots:
  - title: Piston position over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_x
      title: Piston position [mm] (+54 = OT, -54 = UT)
      side: left
      color: '#111111'
    series:
    - signal_key: free_piston_x_m
      label: Piston position
      axis_id: ax_x
      color: '#111111'
      line_style: --
      scale_factor: -1000.0
      unit_preset: raw
      offset: 54.04
      line_width: 1.35
    show_title: true
style:
  default_line_width: 1.6
