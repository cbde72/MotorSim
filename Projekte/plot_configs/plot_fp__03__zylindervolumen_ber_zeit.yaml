name: Zylindervolumen über Zeit
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Zeitplots
  rows: 1
  cols: 1
  subplots:
  - title: Zylindervolumen über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_v
      title: Volumen [cm³]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_V_m3
      label: Zylindervolumen
      axis_id: ax_v
      color: '#027a48'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
