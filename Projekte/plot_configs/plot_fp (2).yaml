name: Free-Piston Zeitplots
figures:
- title: Free-Piston Zeitplots
  rows: 3
  cols: 1
  subplots:
  - title: Zylinderdruck über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: manual
    y_axes:
    - id: ax_p
      title: Druck [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_p_Pa
      label: Zylinderdruck
      axis_id: ax_p
      color: '#b42318'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
    x_min: 0.0
    x_max: 0.6
  - title: Kolbenweg über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: manual
    y_axes:
    - id: ax_x
      title: Kolbenweg [mm] (+54 = OT, -54 = UT)
      side: left
      color: '#111111'
    series:
    - signal_key: free_piston_x_m
      label: Kolbenweg
      axis_id: ax_x
      color: '#175cd3'
      line_style: '-'
      scale_factor: -1000.0
      unit_preset: raw
      offset: 54.04
    x_min: 0.0
    x_max: 0.6
  - title: Zylindervolumen über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: manual
    y_axes:
    - id: ax_v
      title: Volumen [cm³]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_V_m3
      label: Zylindervolumen
      axis_id: ax_v
      color: '#027a48'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    x_min: 0.0
    x_max: 0.6
- title: Free-Piston Kräfte über Zeit
  rows: 1
  cols: 1
  subplots:
  - title: Kräfte über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: manual
    y_axes:
    - id: ax_f
      title: Kraft [N]
      side: left
      color: '#111111'
    series:
    - signal_key: free_piston_F_gas_N
      label: Gaskraft
      axis_id: ax_f
      color: '#b42318'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_F_bounce_N
      label: Bounce-Kraft
      axis_id: ax_f
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_F_friction_N
      label: Reibkraft
      axis_id: ax_f
      color: '#f79009'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_F_load_N
      label: Lastkraft
      axis_id: ax_f
      color: '#7a5af8'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_F_net_N
      label: Nettokraft
      axis_id: ax_f
      color: '#027a48'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    x_min: 0.0
    x_max: 0.6
- title: Free-Piston Dynamik über Zeit
  rows: 1
  cols: 1
  subplots:
  - title: Geschwindigkeit und Beschleunigung über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: manual
    y_axes:
    - id: ax_vel
      title: Geschwindigkeit [m/s]
      side: left
      color: '#111111'
    - id: ax_acc
      title: Beschleunigung [m/s²]
      side: right
      color: '#111111'
    series:
    - signal_key: free_piston_v_m_per_s
      label: Geschwindigkeit
      axis_id: ax_vel
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_a_m_per_s2
      label: Beschleunigung
      axis_id: ax_acc
      color: '#b42318'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    x_min: 0.0
    x_max: 0.6
