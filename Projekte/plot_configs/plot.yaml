versioning:
  package_version: 7.1.99
  config_schema_version: 5
  loaded_config_schema_version: 0
  migration_applied: true
name: Massenströme / Hubvolumen
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Standard Thermo0D Plotpaket
  rows: 1
  cols: 1
  subplots:
  - title: Massenströme / Hubvolumen
    plot_type: line
    x_signal: cylinder_theta_deg
    x_title: Kurbelwinkel [deg]
    x_unit_preset: raw
    events:
    - x: 0.0
      label: OT
      color: '#667085'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 160.0
      label: EVO
      color: '#b42318'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 180.0
      label: UT
      color: '#667085'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 300.0
      label: EVC
      color: '#b42318'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 350.0
      label: SOC
      color: '#f79009'
      line_style: --
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 360.0
      label: OT
      color: '#98a2b3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 370.0
      label: IVO
      color: '#175cd3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 405.0
      label: EOC
      color: '#f79009'
      line_style: --
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 510.0
      label: IVC
      color: '#175cd3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 540.0
      label: UT
      color: '#98a2b3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    y_axes:
    - id: ax_mdot
      title: Massenstrom [kg/s]
      side: left
      color: '#111111'
    - id: ax_vol
      title: Hubvolumen [cm³]
      side: right
      color: '#666666'
    series:
    - signal_key: cylinder_mdot_in_kg_per_s
      label: Einströmender Massenstrom
      axis_id: ax_mdot
      color: '#87cefa'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_mdot_out_kg_per_s
      label: Ausströmender Massenstrom
      axis_id: ax_mdot
      color: '#8b0000'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: cylinder_V_m3
      label: Hubvolumen
      axis_id: ax_vol
      color: '#808080'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
    x_limit_mode: manual
    x_min: 0.0
    x_max: 720.0
