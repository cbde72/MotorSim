name: Slot-Höhen über Zeit
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Slots und Aeff über Zeit
  rows: 1
  cols: 1
  subplots:
  - title: Slot-Höhen über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_h
      title: Slot-Höhe [mm]
      side: left
      color: '#111111'
    series:
    - signal_key: transfer_slot_slot_height_m
      label: Transfer Slot-Höhe
      axis_id: ax_h
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
    - signal_key: exhaust_slot_slot_height_m
      label: Auslass Slot-Höhe
      axis_id: ax_h
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000.0
      unit_preset: raw
