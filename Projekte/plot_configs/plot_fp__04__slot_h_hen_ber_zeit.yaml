name: Slot heightn over time
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-piston slots and effective areas over time
  rows: 1
  cols: 1
  subplots:
  - title: Slot heightn over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_h
      title: Slot height [mm]
      side: left
      color: '#111111'
    series:
    - signal_key: transfer_slot_slot_height_m
      label: Transfer Slot height
      axis_id: ax_h
      color: '#175CD3'
      line_style: --
      scale_factor: 1000.0
      unit_preset: raw
      line_width: 1.05
    - signal_key: exhaust_slot_slot_height_m
      label: Exhaust Slot height
      axis_id: ax_h
      color: '#D92D20'
      line_style: --
      scale_factor: 1000.0
      unit_preset: raw
      line_width: 1.05
    show_title: true
style:
  default_line_width: 1.6
