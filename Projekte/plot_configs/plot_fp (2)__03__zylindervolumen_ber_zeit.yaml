name: Cylindervolumen over time
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Timeplots
  rows: 1
  cols: 1
  subplots:
  - title: Cylindervolumen over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: manual
    y_axes:
    - id: ax_v
      title: Volume [cm³]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_V_m3
      label: Cylinder volume
      axis_id: ax_v
      color: '#7DD3C7'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
      line_width: 1.05
    x_min: 0.0
    x_max: 0.6
    show_title: true
style:
  default_line_width: 1.6
