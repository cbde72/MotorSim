name: Cylinder pressure
style_sheet: ../plot_style_sheet.yaml
figures:
- title: 'Multi-parameter analysis: pressure, temperature, volume'
  rows: 1
  cols: 1
  subplots:
  - title: Cylinder pressure
    x_signal: cylinder_0_theta_deg
    x_title: Crank angle [deg]
    y_axes:
    - id: p_ax
      title: Pressure [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_0_p_Pa
      label: Pressure
      axis_id: p_ax
      color: '#66B3FF'
      line_style: '-'
      scale_factor: 1.0e-05
      line_width: 1.8
    show_title: true
style:
  default_line_width: 1.6
