name: Geschwindigkeit und Beschleunigung über Zeit
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Dynamik über Zeit
  rows: 1
  cols: 1
  subplots:
  - title: Geschwindigkeit und Beschleunigung über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: manual
    y_axes:
    - id: ax_vel
      title: Geschwindigkeit [m/s]
      side: left
      color: '#111111'
    - id: ax_acc
      title: Beschleunigung [m/s²]
      side: right
      color: '#111111'
    series:
    - signal_key: free_piston_v_m_per_s
      label: Geschwindigkeit
      axis_id: ax_vel
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    - signal_key: free_piston_a_m_per_s2
      label: Beschleunigung
      axis_id: ax_acc
      color: '#b42318'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
    x_min: 0.0
    x_max: 0.6
