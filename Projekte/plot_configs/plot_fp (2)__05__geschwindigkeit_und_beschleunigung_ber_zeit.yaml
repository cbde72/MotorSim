name: Velocity and acceleration over time
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Dynamics over time
  rows: 1
  cols: 1
  subplots:
  - title: Velocity and acceleration over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: manual
    y_axes:
    - id: ax_vel
      title: Velocity [m/s]
      side: left
      color: '#111111'
    - id: ax_acc
      title: Acceleration [m/s²]
      side: right
      color: '#111111'
    series:
    - signal_key: free_piston_v_m_per_s
      label: Velocity
      axis_id: ax_vel
      color: '#111111'
      line_style: --
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.35
    - signal_key: free_piston_a_m_per_s2
      label: Acceleration
      axis_id: ax_acc
      color: '#111111'
      line_style: --
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.35
    x_min: 0.0
    x_max: 0.6
    show_title: true
style:
  default_line_width: 1.6
