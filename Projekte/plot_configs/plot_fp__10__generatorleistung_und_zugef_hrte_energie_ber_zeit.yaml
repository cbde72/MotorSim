name: Generator power and added energy over time
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Generator power and added energy over time
  rows: 1
  cols: 1
  subplots:
  - title: Generator power and added energy over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_pow
      title: Power [W]
      side: left
      color: '#111111'
    series:
    - signal_key: free_piston_generator_power_W
      label: Generator power
      axis_id: ax_pow
      color: '#667085'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_added_energy_W
      label: Added energy
      axis_id: ax_pow
      color: '#C2185B'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.9
    show_title: true
style:
  default_line_width: 1.6
