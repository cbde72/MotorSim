name: Enthalpie ein/aus cumulative / Valve lift
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Enthalpie ein/aus cumulative / Valve lift
  rows: 1
  cols: 1
  subplots:
  - title: ''
    plot_type: line
    x_signal: cylinder_theta_deg
    x_title: Crank angle [deg]
    x_unit_preset: raw
    events:
    - x: 0.0
      label: OT
      color: '#667085'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 160.0
      label: EVO
      color: '#b42318'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 180.0
      label: UT
      color: '#667085'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 300.0
      label: EVC
      color: '#b42318'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 350.0
      label: SOC
      color: '#f79009'
      line_style: --
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 360.0
      label: OT
      color: '#98a2b3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 370.0
      label: IVO
      color: '#175cd3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 405.0
      label: EOC
      color: '#f79009'
      line_style: --
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 510.0
      label: IVC
      color: '#175cd3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    - x: 540.0
      label: UT
      color: '#98a2b3'
      line_style: ':'
      line_width: 1.0
      alpha: 0.9
      visible: true
      show_label: true
    y_axes:
    - id: ax_main
      title: Enthalpie [J]
      side: left
      color: '#111111'
    - id: ax_lift
      title: Valve lift [mm]
      side: right
      color: '#111111'
    series:
    - signal_key: cylinder_enthalpy_in_cycle_J
      label: Enthalpie ein (cumulative)
      axis_id: ax_main
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: cylinder_enthalpy_out_cycle_J
      label: Enthalpie aus (cumulative)
      axis_id: ax_main
      color: '#7DD3C7'
      line_style: '-'
      scale_factor: 1.0
      unit_preset: raw
      line_width: 1.6
    - signal_key: intake_valve_valve_lift_m
      label: Intake valve lift
      axis_id: ax_lift
      color: '#175CD3'
      line_style: --
      scale_factor: 1000.0
      unit_preset: raw
      line_width: 1.05
    - signal_key: exhaust_valve_valve_lift_m
      label: Exhaust valve lift
      axis_id: ax_lift
      color: '#D92D20'
      line_style: --
      scale_factor: 1000.0
      unit_preset: raw
      line_width: 1.05
    x_limit_mode: manual
    x_min: 0.0
    x_max: 720.0
    show_title: true
style:
  default_line_width: 1.6
