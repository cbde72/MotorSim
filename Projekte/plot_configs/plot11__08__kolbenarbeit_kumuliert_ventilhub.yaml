name: Cumulative piston work / valve lift
style_sheet: ../plot_style_sheet.yaml
style:
  default_line_width: 1.6
figures:
- id: e753cc603a1f
  title: Cumulative piston work / valve lift
  rows: 1
  cols: 1
  subplots:
  - id: 29816264dec1
