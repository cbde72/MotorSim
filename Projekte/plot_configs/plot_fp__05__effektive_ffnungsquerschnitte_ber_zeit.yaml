name: Effektive Opening areae over time
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-piston slots and effective areas over time
  rows: 1
  cols: 1
  subplots:
  - title: Effektive Opening areae over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_a
      title: A_eff [mm²]
      side: left
      color: '#111111'
    series:
    - signal_key: transfer_slot_A_eff_forward_m2
      label: Transfer A_eff forward
      axis_id: ax_a
      color: '#175CD3'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
      line_width: 1.05
    - signal_key: transfer_slot_A_eff_reverse_m2
      label: Transfer A_eff reverse
      axis_id: ax_a
      color: '#175CD3'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
      line_width: 1.05
    - signal_key: exhaust_slot_A_eff_forward_m2
      label: Exhaust A_eff forward
      axis_id: ax_a
      color: '#D92D20'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
      line_width: 1.05
    - signal_key: exhaust_slot_A_eff_reverse_m2
      label: Exhaust A_eff reverse
      axis_id: ax_a
      color: '#D92D20'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
      line_width: 1.05
    show_title: true
style:
  default_line_width: 1.6
