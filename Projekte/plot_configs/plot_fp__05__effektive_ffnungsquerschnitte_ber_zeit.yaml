name: Effektive Öffnungsquerschnitte über Zeit
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Slots und Aeff über Zeit
  rows: 1
  cols: 1
  subplots:
  - title: Effektive Öffnungsquerschnitte über Zeit
    plot_type: line
    x_signal: t_s
    x_title: Zeit [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_a
      title: A_eff [mm²]
      side: left
      color: '#111111'
    series:
    - signal_key: transfer_slot_A_eff_forward_m2
      label: Transfer A_eff vorwärts
      axis_id: ax_a
      color: '#175cd3'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: transfer_slot_A_eff_reverse_m2
      label: Transfer A_eff rückwärts
      axis_id: ax_a
      color: '#5da9ff'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: exhaust_slot_A_eff_forward_m2
      label: Auslass A_eff vorwärts
      axis_id: ax_a
      color: '#b42318'
      line_style: '-'
      scale_factor: 1000000.0
      unit_preset: raw
    - signal_key: exhaust_slot_A_eff_reverse_m2
      label: Auslass A_eff rückwärts
      axis_id: ax_a
      color: '#f97066'
      line_style: --
      scale_factor: 1000000.0
      unit_preset: raw
