name: Cylinder volume vs. cylinder pressure
style_sheet: ../plot_style_sheet.yaml
figures:
- title: 'pV diagram: last complete stroke (BDC-TDC-BDC)'
  rows: 1
  cols: 1
  subplots:
  - title: Cylinder volume vs. cylinder pressure
    x_signal: cylinder_0_V_m3
    x_title: Cylindervolumen [cm³]
    y_axes:
    - id: pressure_axis
      title: Cylinder pressure [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_0_p_Pa
      label: Cylinder pressure (last stroke)
      axis_id: pressure_axis
      color: '#66B3FF'
      line_style: '-'
      line_width: 1.8
      scale_factor: 1.0e-05
    events:
    - x: 50.0
      label: OT (Top Dead Center)
      color: '#d62728'
      line_style: ':'
      line_width: 1.5
      alpha: 0.8
      show_label: true
      event_type: tdc
    show_title: true
style:
  default_line_width: 1.6
