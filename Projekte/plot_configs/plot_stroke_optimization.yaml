name: Zylindervolumen vs. Zylinderdruck
style_sheet: ../plot_style_sheet.yaml
figures:
- title: 'pV-Diagramm: Letzter vollständiger Hub (UT-OT-UT)'
  rows: 1
  cols: 1
  subplots:
  - title: Zylindervolumen vs. Zylinderdruck
    x_signal: cylinder_0_V_m3
    x_title: Zylindervolumen [cm³]
    y_axes:
    - id: pressure_axis
      title: Zylinderdruck [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_0_p_Pa
      label: Zylinderdruck (letzter Hub)
      axis_id: pressure_axis
      color: '#1f77b4'
      line_style: '-'
      line_width: 2.5
      scale_factor: 1.0e-05
    events:
    - x: 50.0
      label: OT (Top Dead Center)
      color: '#d62728'
      line_style: ':'
      line_width: 1.5
      alpha: 0.8
      show_label: true
      event_type: tdc
