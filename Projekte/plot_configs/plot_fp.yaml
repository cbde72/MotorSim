name: Cylinder pressure over time
style_sheet: ../plot_style_sheet.yaml
figures:
- title: Free-Piston Timeplots
  rows: 1
  cols: 1
  subplots:
  - title: Cylinder pressure over time
    plot_type: line
    x_signal: t_s
    x_title: Time [s]
    x_unit_preset: raw
    x_limit_mode: auto
    y_axes:
    - id: ax_p
      title: Pressure [bar]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_p_Pa
      label: Cylinder pressure
      axis_id: ax_p
      color: '#66B3FF'
      line_style: '-'
      scale_factor: 1.0e-05
      unit_preset: raw
      line_width: 1.8
    show_title: true
style:
  default_line_width: 1.6
