name: Hubvolumen
style_sheet: ../plot_style_sheet.yaml
figures:
- title: 'Mehrparameter-Analyse: Druck, Temperatur, Volumen'
  rows: 1
  cols: 1
  subplots:
  - title: Hubvolumen
    x_signal: cylinder_0_theta_deg
    x_title: Kurbelwinkel [°]
    y_axes:
    - id: v_ax
      title: Volumen [cm³]
      side: left
    series:
    - signal_key: cylinder_0_V_m3
      label: Volumen
      axis_id: v_ax
      color: '#2ca02c'
      line_style: '-'
      scale_factor: 1.0e6
