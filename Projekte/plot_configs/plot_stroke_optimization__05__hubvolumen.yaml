name: Displacement volume
style_sheet: ../plot_style_sheet.yaml
figures:
- title: 'Multi-parameter analysis: pressure, temperature, volume'
  rows: 1
  cols: 1
  subplots:
  - title: Displacement volume
    x_signal: cylinder_0_theta_deg
    x_title: Crank angle [deg]
    y_axes:
    - id: v_ax
      title: Volume [cm³]
      side: left
      color: '#111111'
    series:
    - signal_key: cylinder_0_V_m3
      label: Volume
      axis_id: v_ax
      color: '#7DD3C7'
      line_style: --
      scale_factor: 1.0e6
      line_width: 1.05
    show_title: true
style:
  default_line_width: 1.6
