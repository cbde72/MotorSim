# ============================================================================
# Thermo0D – kommentierte Beispielkonfiguration für Woschni-Varianten
# ----------------------------------------------------------------------------
# variant: legacy  -> bisheriges Projektmodell mit c1/c2/c3
# variant: promo   -> historischer Quellenansatz / WoschniPromo
# variant: classic -> klassische Woschni-Variante
# variant: swirl   -> classic + swirl_number
# variant: gt      -> GT-nahe WoschniGT-Variante
# variant: huber   -> Huber-Variante
#
# Empfehlung für stabile erste Läufe:
#   - mit variant: promo starten
#   - dp_mode: off lassen
# ============================================================================

test_description: "Dokumentierte Woschni-Variantenkonfiguration"

preprocessing:
  gas_properties:
    cp_J_per_kgK: 1005.0
    cv_J_per_kgK: 718.0
    R_J_per_kgK: 287.0

  features:
    mass_flow: true
    wall_heat: true
    combustion: true
    evaporation: false
    pv_work: true

  engine:
    cycle_type: 4t
    speed_rpm: 2500.0

  volumes:
    - name: cylinder
      type: cylinder
      initial_pressure_Pa: 1080650.993791
      initial_temperature_K: 360.0
      kinematics:
        type: crank_slider
        bore_m: 0.086
        stroke_m: 0.086
        conrod_m: 0.143
        compression_ratio: 10.5
        phase_deg: 0.0
      wall_heat:
        model: woschni
        variant: promo
        wall_temperature_K: 430.0
        wall_area_m2: 0.032
        multiplier: 1.0
        cucm: 0.0
        swirl_number: 0.0
        imep_bar: 6.0
        dp_mode: off
        reference_state_mode: none
        phase_mode: promo
        c1: 3.26
        c2: 0.8
        c3: -0.55
      combustion:
        model: vibe
        start_deg: 350.0
        duration_deg: 55.0
        a: 6.908
        m: 2.0
        fuel_mass_per_cycle_kg: 0.000020
        lhv_J_per_kg: 43000000.0
        angle_reference: compression_tdc
      evaporation:
        model: none

    - name: intake_plenum
      type: plenum
      initial_pressure_Pa: 105042.0
      initial_temperature_K: 305.0
      fixed_volume_m3: 0.0025
      wall_heat:
        model: none
      combustion:
        model: none
      evaporation:
        model: none

    - name: exhaust_plenum
      type: plenum
      initial_pressure_Pa: 149240.0
      initial_temperature_K: 650.0
      fixed_volume_m3: 0.0030
      wall_heat:
        model: none
      combustion:
        model: none
      evaporation:
        model: none

  connections:
    - name: intake_valve
      type: valve
      from_volume: intake_plenum
      to_volume: cylinder
      opening_angle_deg: 330.0
      opening_reference: compression_tdc
      profile_angle_domain: crank
      lift_scale: 1.0
      lash_m: 0.0001
      lift_file: data/intake_valve_lift.csv
      alpha_k_file: data/intake_alpha_k.csv

    - name: exhaust_valve
      type: valve
      from_volume: cylinder
      to_volume: exhaust_plenum
      opening_angle_deg: 120.0
      opening_reference: compression_tdc
      profile_angle_domain: crank
      lift_scale: 1.0
      lash_m: 0.0001
      lift_file: data/exhaust_valve_lift.csv
      alpha_k_file: data/exhaust_alpha_k.csv

simulation:
  dt_s: 0.00002
  total_cycles: 3
  save_last_cycles: 2
  solver:
    kind: rk4
    rtol: 1.0e-6
    atol: 1.0e-9

postprocessing:
  csv_path: results/woschni_variants_documented.csv
  csv_separator: ";"
  sampling:
    mode: crank_angle
    step_deg: 1.0
